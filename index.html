<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Ludwig Van Beethoven</title>


  <!-- ==========================================
       LECTOR QR
       ========================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* ==========================================
       RESET
       ========================================== */

    * {
      box-sizing: border-box;
    }


    html {
      width: 100%;
      min-height: 100%;
    }


    body {

      margin: 0;

      width: 100%;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #0f172a 0%,
          #172554 50%,
          #0f766e 100%
        );

      color: #0f172a;

      padding:
        clamp(8px, 2vw, 28px);

    }


    /* ==========================================
       CONTENEDOR
       ========================================== */

    .app {

      width: 100%;

      max-width: 820px;

      margin: 0 auto;

    }


    /* ==========================================
       ENCABEZADO
       ========================================== */

    .header {

      color: white;

      margin-bottom:
        clamp(10px, 2vw, 18px);

    }


    .header-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .title {

      margin: 0;

      font-size:
        clamp(21px, 4vw, 30px);

      font-weight: 750;

      line-height: 1.15;

      letter-spacing: -0.5px;

    }


    .subtitle {

      margin:
        5px 0 0;

      color: #cbd5e1;

      font-size:
        clamp(11px, 1.8vw, 14px);

    }


    /* ==========================================
       ESTADO DE CONEXIÓN
       ========================================== */

    .connection {

      display: flex;

      align-items: center;

      gap: 6px;

      padding:
        7px 11px;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.12);

      border:
        1px solid
        rgba(255,255,255,0.15);

      color: white;

      font-size:
        clamp(10px, 1.5vw, 12px);

      white-space: nowrap;

      flex-shrink: 0;

    }


    .connection-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #22c55e;

      flex-shrink: 0;

    }


    .connection.offline .connection-dot {

      background: #f59e0b;

    }


    /* ==========================================
       TARJETA PRINCIPAL
       ========================================== */

    .card {

      width: 100%;

      background:
        rgba(255,255,255,0.98);

      border-radius:
        clamp(16px, 3vw, 24px);

      padding:
        clamp(12px, 3vw, 26px);

      box-shadow:
        0 18px 40px
        rgba(0,0,0,0.25);

    }


    /* ==========================================
       ESTADÍSTICAS SUPERIORES
       ========================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        clamp(7px, 2vw, 12px);

      margin-bottom:
        clamp(11px, 2vw, 18px);

    }


    .stat {

      min-width: 0;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 13px;

      padding:
        clamp(9px, 2vw, 14px);

    }


    .stat-label {

      font-size:
        clamp(9px, 1.5vw, 11px);

      color: #64748b;

      margin-bottom: 3px;

    }


    .stat-value {

      font-size:
        clamp(18px, 3vw, 24px);

      font-weight: 750;

      color: #0f172a;

    }


    /* ==========================================
       RESUMEN DE ASISTENCIA
       ========================================== */

    .resumen-asistencia {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin:
        0 0 12px;

    }


    .tarjeta-resumen {

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding:
        14px 8px;

      text-align: center;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.06);

    }


    .titulo-resumen {

      font-size: 12px;

      color: #64748b;

      margin-bottom: 5px;

    }


    .numero-resumen {

      font-size: 28px;

      font-weight: 750;

      color: #0f172a;

      line-height: 1;

    }


    /* ==========================================
       BARRA DE ASISTENCIA
       ========================================== */

    .barra-asistencia {

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding: 13px 14px;

      margin-bottom: 18px;

    }


    .barra-superior {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

      font-size: 13px;

      color: #475569;

    }


    .barra-superior strong {

      font-size: 15px;

      color: #0f172a;

    }


    .barra-fondo {

      width: 100%;

      height: 10px;

      background: #e2e8f0;

      border-radius: 10px;

      overflow: hidden;

    }


    .barra-progreso {

      height: 100%;

      width: 0%;

      background: #22c55e;

      border-radius: 10px;

      transition:
        width 0.3s ease;

    }


    /* ==========================================
       CABECERA DEL ESCÁNER
       ========================================== */

    .camera-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

    }


    .camera-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 700;

      color: #1e293b;

    }


    .camera-status {

      font-size:
        clamp(10px, 1.5vw, 12px);

      color: #64748b;

      text-align: right;

    }


    /* ==========================================
       CÁMARA RESPONSIVA
       ========================================== */

    .camera-wrapper {

      width: 100%;

      max-width:
        min(460px, 78vw);

      margin:
        0 auto;

      padding: 4px;

      background: #020617;

      border-radius:
        clamp(15px, 3vw, 20px);

      box-shadow:
        0 8px 22px
        rgba(15,23,42,0.20);

      overflow: hidden;

    }


    #reader {

      width: 100%;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      max-width: 100% !important;

      border-radius: 14px !important;

      object-fit: cover !important;

    }


    #reader__scan_region {

      background: #020617 !important;

    }


    #reader__dashboard {

      background: #020617 !important;

      padding: 5px !important;

    }


    #reader__dashboard_section_swaplink {

      color: white !important;

    }


    /* ==========================================
       RESULTADO
       ========================================== */

    .result {

      width: 100%;

      margin-top:
        clamp(10px, 2vw, 14px);

      padding:
        clamp(10px, 2vw, 15px);

      min-height:
        clamp(64px, 10vw, 78px);

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      border-radius: 14px;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

    }


    .result-icon {

      font-size:
        clamp(20px, 3vw, 25px);

      margin-bottom: 2px;

    }


    .result-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 750;

      color: #334155;

      overflow-wrap: anywhere;

    }


    .result-detail {

      margin-top: 3px;

      font-size:
        clamp(11px, 1.7vw, 13px);

      color: #64748b;

      white-space: pre-line;

      overflow-wrap: anywhere;

    }


    .result.success {

      background: #ecfdf5;

      border-color: #a7f3d0;

    }


    .result.success .result-title {

      color: #047857;

    }


    .result.error {

      background: #fef2f2;

      border-color: #fecaca;

    }


    .result.error .result-title {

      color: #b91c1c;

    }


    .result.offline {

      background: #fffbeb;

      border-color: #fde68a;

    }


    .result.offline .result-title {

      color: #92400e;

    }


    /* ==========================================
       BOTÓN
       ========================================== */

    .sync-button {

      width: 100%;

      min-height: 44px;

      margin-top:
        clamp(9px, 2vw, 12px);

      padding:
        10px 14px;

      border: 0;

      border-radius: 11px;

      background: #0f172a;

      color: white;

      font-size:
        clamp(11px, 1.7vw, 13px);

      font-weight: 650;

      cursor: pointer;

    }


    .sync-button:disabled {

      opacity: 0.45;

      cursor: default;

    }


    /* ==========================================
       PIE
       ========================================== */

    .footer {

      text-align: center;

      margin-top:
        clamp(9px, 2vw, 13px);

      color: #94a3b8;

      font-size:
        clamp(9px, 1.4vw, 11px);

    }


    /* ==========================================
       CELULARES PEQUEÑOS
       ========================================== */

    @media (max-width: 380px) {

      body {

        padding: 8px;

      }


      .header-row {

        gap: 8px;

        align-items: flex-start;

      }


      .title {

        font-size: 20px;

      }


      .subtitle {

        font-size: 11px;

      }


      .connection {

        padding:
          6px 8px;

        font-size: 10px;

      }


      .card {

        padding: 11px;

      }


      .camera-wrapper {

        max-width: 300px;

      }


      .numero-resumen {

        font-size: 23px;

      }


      .titulo-resumen {

        font-size: 10px;

      }

    }


    /* ==========================================
       CELULARES MEDIANOS
       ========================================== */

    @media (
      min-width: 381px
    ) and (
      max-width: 599px
    ) {

      .camera-wrapper {

        max-width: 340px;

      }

    }


    /* ==========================================
       TABLETS
       ========================================== */

    @media (min-width: 600px) {

      .camera-wrapper {

        max-width: 400px;

      }

      .card {

        padding: 22px;

      }

    }


    /* ==========================================
       LAPTOP
       ========================================== */

    @media (min-width: 900px) {

      .app {

        max-width: 820px;

      }


      .camera-wrapper {

        max-width: 440px;

      }


      .card {

        padding: 26px;

      }

    }


    /* ==========================================
       MONITORES GRANDES
       ========================================== */

    @media (min-width: 1200px) {

      .app {

        max-width: 850px;

      }


      .camera-wrapper {

        max-width: 460px;

      }

    }


    /* ==========================================
       CELULAR / TABLET HORIZONTAL
       ========================================== */

    @media (
      max-height: 600px
    ) and (
      orientation: landscape
    ) {

      body {

        padding:
          8px 14px;

      }


      .header {

        margin-bottom: 7px;

      }


      .title {

        font-size: 20px;

      }


      .subtitle {

        display: none;

      }


      .card {

        padding:
          10px 14px;

      }


      .stats {

        margin-bottom: 7px;

      }


      .camera-wrapper {

        max-width: 300px;

      }


      .result {

        margin-top: 7px;

        min-height: 54px;

        padding: 7px;

      }


      .footer {

        display: none;

      }

    }


    /* ==========================================
       PANTALLAS MUY PEQUEÑAS
       ========================================== */

    @media (max-width: 320px) {

      body {

        padding: 5px;

      }


      .title {

        font-size: 18px;

      }


      .connection {

        font-size: 9px;

        padding:
          5px 7px;

      }


      .card {

        padding: 9px;

        border-radius: 15px;

      }


      .camera-wrapper {

        max-width: 285px;

      }


      .result {

        padding: 8px;

      }


      .resumen-asistencia {

        gap: 4px;

      }


      .numero-resumen {

        font-size: 21px;

      }

    }


    /* ==========================================
       DISPOSITIVOS TÁCTILES
       ========================================== */

    @media (pointer: coarse) {

      .sync-button {

        min-height: 46px;

      }

    }


  </style>

</head>


<body>


  <main class="app">


    <!-- ========================================
         ENCABEZADO
         ======================================== -->

    <header class="header">

      <div class="header-row">

        <div>

          <h1 class="title">
            Secundaria N° 101 "Ludwig Van Beethoven"
          </h1>

          <p class="subtitle">
            Control de Asistencia
          </p>

        </div>


        <div
          id="connectionStatus"
          class="connection"

          </div>

        <div class="tarjeta-resumen">

          <div class="titulo-resumen">
            Han ingresado
          </div>

          <div
            id="hanIngresado"

          >
            0
          </div>

        <div class="tarjeta-resumen">

          <div class="titulo-resumen">

          </div>

      <!-- ======================================

      <div class="barra-asistencia">

      <button

    <footer class="footer">

    </footer>


  </main>


  <script>


    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


    /* =====================================================
       VARIABLES
       ===================================================== */

    let scanner = null;

    let procesando = false;


    /* =====================================================
       BASE DE DATOS LOCAL
       ===================================================== */

    const DB_NAME =
      "AsistenciaQR";

    const DB_VERSION =
      1;

    let db = null;


    /* =====================================================
       ABRIR BASE DE DATOS
       ===================================================== */

    function abrirBaseDatos() {

      return new Promise(
        function(resolve, reject) {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            function(event) {

              const database =
                event.target.result;


              if (
                !database.objectStoreNames.contains(
                  "alumnos"
                )
              ) {

                database.createObjectStore(
                  "alumnos",
                  {
                    keyPath: "idQR"
                  }
                );

              }


              if (
                !database.objectStoreNames.contains(
                  "asistencias"
                )
              ) {

                const store =
                  database.createObjectStore(
                    "asistencias",
                    {
                      keyPath: "id",
                      autoIncrement: true
                    }
                  );


                store.createIndex(
                  "estado",
                  "estado",
                  {
                    unique: false
                  }
                );

              }

            };


          request.onsuccess =
            function(event) {

              db =
                event.target.result;

              resolve(db);

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       GUARDAR ALUMNOS
       ===================================================== */

    function guardarAlumnos(alumnos) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve();

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          alumnos.forEach(
            function(alumno) {

              store.put({

                idQR:
                  alumno.idQR,

                nombre:
                  alumno.nombre,

                grupo:
                  alumno.grupo,

                activo:
                  alumno.activo

              });

            }
          );


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER TODOS LOS ALUMNOS LOCALES
       ===================================================== */

    function obtenerTodosLosAlumnos() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER TODAS LAS ASISTENCIAS LOCALES
       ===================================================== */

    function obtenerTodasLasAsistencias() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER ALUMNO LOCAL
       ===================================================== */

    function obtenerAlumnoLocal(idQR) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve(null);

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          const request =
            store.get(idQR);


          request.onsuccess =
            function() {

              resolve(
                request.result ||
                null
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       CONTAR ALUMNOS
       ===================================================== */

    function actualizarTotalAlumnos() {

      return new Promise(
        function(resolve) {

          if (!db) {

            resolve();

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              const alumnos =
                request.result || [];


              const activos =
                alumnos.filter(
                  function(alumno) {

                    const estado =
                      String(
                        alumno.activo || ""
                      )
                      .trim()
                      .toLowerCase();


                    return (
                      estado === "sí" ||
                      estado === "si"
                    );

                  }
                );


              document.getElementById(
                "totalAlumnos"
              ).textContent =
                activos.length;


              resolve();

            };


          request.onerror =
            function() {

              resolve();

            };

        }
      );

    }


    /* =====================================================
       GUARDAR ASISTENCIA LOCAL
       ===================================================== */

    function guardarAsistenciaLocal(
      asistencia
    ) {

      return new Promise(
        function(resolve, reject) {

          const transaction =
            db.transaction(
              "asistencias",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          store.add(
            asistencia
          );


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER PENDIENTES
       ===================================================== */

    function obtenerPendientes() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              const todos =
                request.result ||
                [];


              const pendientes =
                todos.filter(
                  function(item) {

                    return (
                      item.estado ===
                      "pendiente"
                    );

                  }
                );


              resolve(
                pendientes
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       ACTUALIZAR PENDIENTES
       ===================================================== */

    async function actualizarPendientes() {

      const pendientes =
        await obtenerPendientes();


      document.getElementById(
        "pendientes"
      ).textContent =
        pendientes.length;


      document.getElementById(
        "syncButton"
      ).disabled =
        pendientes.length === 0;

    }


    /* =====================================================
       MOSTRAR RESULTADO
       ===================================================== */

    function mostrarResultado(
      icono,
      titulo,
      detalle,
      clase
    ) {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.className =
        "result " + clase;


      resultado.innerHTML =

        "<div>" +

          '<div class="result-icon">' +
            icono +
          "</div>" +

          '<div class="result-title">' +
            titulo +
          "</div>" +

          '<div class="result-detail">' +
            detalle +
          "</div>" +

        "</div>";

    }


    /* =====================================================
       CONEXIÓN
       ===================================================== */

    function actualizarConexion() {

      const status =
        document.getElementById(
          "connectionStatus"
        );


      const texto =
        document.getElementById(
          "connectionText"
        );


      if (navigator.onLine) {

        status.classList.remove(
          "offline"
        );


        texto.textContent =
          "Conectado";

      }
      else {

        status.classList.add(
          "offline"
        );


        texto.textContent =
          "Sin conexión";

      }

    }


    /* =====================================================
       CARGAR ALUMNOS
       ===================================================== */

    async function cargarAlumnos() {

      if (!navigator.onLine) {

        await actualizarTotalAlumnos();

        return;

      }


      try {

        const url =
          API_URL +
          "?action=alumnos&t=" +
          Date.now();


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (
          data.ok &&
          Array.isArray(
            data.alumnos
          )
        ) {

          await guardarAlumnos(
            data.alumnos
          );


          await actualizarTotalAlumnos();

        }

      }
      catch(error) {

        console.log(
          "No se pudieron actualizar alumnos:",
          error
        );


        await actualizarTotalAlumnos();

      }

    }


    /* =====================================================
       FECHA LOCAL
       ===================================================== */

    function obtenerFecha() {

      const ahora =
        new Date();


      const dia =
        String(
          ahora.getDate()
        ).padStart(
          2,
          "0"
        );


      const mes =
        String(
          ahora.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const año =
        ahora.getFullYear();


      return (
        dia +
        "/" +
        mes +
        "/" +
        año
      );

    }


    /* =====================================================
       HORA LOCAL
       ===================================================== */

    function obtenerHora() {

      const ahora =
        new Date();


      const horas =
        String(
          ahora.getHours()
        ).padStart(
          2,
          "0"
        );


      const minutos =
        String(
          ahora.getMinutes()
        ).padStart(
          2,
          "0"
        );


      const segundos =
        String(
          ahora.getSeconds()
        ).padStart(
          2,
          "0"
        );


      return (
        horas +
        ":" +
        minutos +
        ":" +
        segundos
      );

    }


    /* =====================================================
       ACTUALIZAR RESUMEN DE ASISTENCIA
       ===================================================== */

    async function actualizarResumenAsistencia() {

      if (!navigator.onLine) {

        return;

      }


      try {

        const url =
          API_URL +
          "?action=resumen&t=" +
          Date.now();


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (!data.ok) {

          return;

        }


        document.getElementById(
          "totalActivos"
        ).textContent =
          data.totalActivos;


        document.getElementById(
          "hanIngresado"
        ).textContent =
          data.hanIngresado;


        document.getElementById(
          "faltanIngresar"
        ).textContent =
          data.faltan;


        document.getElementById(
          "porcentajeAsistencia"
        ).textContent =
          data.porcentaje +
          "%";


        document.getElementById(
          "barraProgreso"
        ).style.width =
          data.porcentaje +
          "%";


      }
      catch(error) {

        console.error(
          "Error actualizando resumen:",
          error
        );

      }

    }


    /* =====================================================
       DUPLICADO LOCAL
       ===================================================== */

    function verificarDuplicadoLocal(
      idQR,
      fecha
    ) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve(false);

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              const duplicado =
                request.result.some(
                  function(item) {

                    return (
                      item.idQR ===
                        idQR &&
                      item.fecha ===
                        fecha
                    );

                  }
                );


              resolve(
                duplicado
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       REGISTRAR OFFLINE
       ===================================================== */

    async function registrarOffline(
      idQR
    ) {

      const alumno =
        await obtenerAlumnoLocal(
          idQR
        );


      /* ALUMNO NO ENCONTRADO */

      if (!alumno) {

        mostrarResultado(
          "❌",
          "Código no registrado",
          "Este alumno todavía no está almacenado en el dispositivo.",
          "error"
        );

        return;

      }


      /* VALIDAR ALUMNO ACTIVO */

      const activo =
        String(
          alumno.activo || ""
        )
        .trim()
        .toLowerCase();


      if (
        activo !== "sí" &&
        activo !== "si"
      ) {

        mostrarResultado(
          "🚫",
          "Alumno inactivo",
          alumno.nombre +
          " · " +
          alumno.grupo +
          "\nNo tiene autorización para registrar asistencia.",
          "error"
        );

        return;

      }


      /* FECHA Y HORA */

      const fecha =
        obtenerFecha();


      const hora =
        obtenerHora();


      /* DUPLICADO */

      const duplicado =
        await verificarDuplicadoLocal(
          idQR,
          fecha
        );


      if (duplicado) {

        mostrarResultado(
          "⚠️",
          "Asistencia duplicada",
          alumno.nombre +
          " · " +
          alumno.grupo +
          "\nYa fue registrado hoy.",
          "error"
        );

        return;

      }


      /* GUARDAR */

      await guardarAsistenciaLocal({

        idQR:
          idQR,

        nombre:
          alumno.nombre,

        grupo:
          alumno.grupo,

        fecha:
          fecha,

        hora:
          hora,

        estado:
          "pendiente"

      });


      await actualizarPendientes();


      mostrarResultado(
        "📱",
        "Asistencia guardada",
        alumno.nombre +
        " · " +
        alumno.grupo +
        "\nGuardada en el dispositivo. Se sincronizará al recuperar Internet.",
        "offline"
      );

    }


    /* =====================================================
       PROCESAR QR
       ===================================================== */

    async function procesarQR(
      idQR
    ) {

      if (procesando) {

        return;

      }


      procesando = true;


      try {


        /* ==========================================
           OFFLINE
           ========================================== */

        if (!navigator.onLine) {

          await registrarOffline(
            idQR
          );

          return;

        }


        /* ==========================================
           ONLINE
           ========================================== */

        mostrarResultado(
          "⏳",
          "Procesando...",
          "Consultando servidor",
          ""
        );


        const url =
          API_URL +
          "?idQR=" +
          encodeURIComponent(
            idQR
          ) +
          "&t=" +
          Date.now();


        const response =
          await fetch(url);


        const data =
          await response.json();


        console.log(
          "Respuesta:",
          data
        );


        /* ==========================================
           REGISTRO CORRECTO
           ========================================== */

        if (data.ok) {

          mostrarResultado(
            "✓",
            "Asistencia registrada",
            data.nombre +
            " · " +
            data.grupo +
            "\n" +
            data.hora,
            "success"
          );


          await actualizarResumenAsistencia();

        }


        /* ==========================================
           ALUMNO INACTIVO
           ========================================== */

        else if (data.inactivo) {

          mostrarResultado(
            "🚫",
            "Alumno inactivo",
            data.nombre +
            " · " +
            data.grupo +
            "\n" +
            data.mensaje,
            "error"
          );

        }


        /* ==========================================
           DUPLICADO
           ========================================== */

        else if (data.duplicado) {

          mostrarResultado(
            "⚠️",
            "Asistencia duplicada",
            data.mensaje,
            "error"
          );

        }


        /* ==========================================
           OTRO ERROR
           ========================================== */

        else {

          mostrarResultado(
            "❌",
            "Código no registrado",
            data.mensaje ||
            "El código QR no está registrado.",
            "error"
          );

        }

      }
      catch(error) {

        console.error(
          "Error:",
          error
        );


        /* ==========================================
           SI SE PERDIÓ INTERNET
           ========================================== */

        if (!navigator.onLine) {

          await registrarOffline(
            idQR
          );

        }
        else {

          mostrarResultado(
            "❌",
            "Error de conexión",
            "No fue posible comunicarse con el servidor.",
            "error"
          );

        }

      }
      finally {

        setTimeout(
          function() {

            procesando =
              false;

          },
          1500
        );

      }

    }


    /* =====================================================
       SINCRONIZAR PENDIENTES
       ===================================================== */

    async function sincronizarPendientes() {

      if (!navigator.onLine) {

        mostrarResultado(
          "📱",
          "Sin conexión",
          "Las asistencias permanecen guardadas en el dispositivo.",
          "offline"
        );

        return;

      }


      const pendientes =
        await obtenerPendientes();


      if (
        pendientes.length === 0
      ) {

        await actualizarPendientes();

        await actualizarResumenAsistencia();

        return;

      }


      const boton =
        document.getElementById(
          "syncButton"
        );


      boton.disabled =
        true;


      boton.textContent =
        "Sincronizando...";


      for (
        const asistencia of pendientes
      ) {

        try {

          const url =
            API_URL +
            "?action=registrar" +
            "&idQR=" +
            encodeURIComponent(
              asistencia.idQR
            ) +
            "&nombre=" +
            encodeURIComponent(
              asistencia.nombre
            ) +
            "&grupo=" +
            encodeURIComponent(
              asistencia.grupo
            ) +
            "&fecha=" +
            encodeURIComponent(
              asistencia.fecha
            ) +
            "&hora=" +
            encodeURIComponent(
              asistencia.hora
            ) +
            "&t=" +
            Date.now();


          const response =
            await fetch(url);


          const data =
            await response.json();


          if (
            data.ok ||
            data.duplicado
          ) {

            await eliminarAsistencia(
              asistencia.id
            );

          }
          else if (data.inactivo) {

            /*
              El alumno fue desactivado
              antes de sincronizar.
              No se registra la asistencia.
            */

            await eliminarAsistencia(
              asistencia.id
            );

          }

        }
        catch(error) {

          console.log(
            "No se pudo sincronizar:",
            asistencia
          );

          break;

        }

      }


      await actualizarPendientes();


      await actualizarResumenAsistencia();


      boton.textContent =
        "Sincronizar pendientes";

    }


    /* =====================================================
       ELIMINAR ASISTENCIA LOCAL
       ===================================================== */

    function eliminarAsistencia(
      id
    ) {

      return new Promise(
        function(resolve, reject) {

          const transaction =
            db.transaction(
              "asistencias",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          store.delete(id);


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       INICIAR CÁMARA
       ===================================================== */

    async function iniciarCamara() {

      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        mostrarResultado(
          "❌",
          "Lector QR no disponible",
          "No se pudo cargar html5-qrcode.",
          "error"
        );

        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Lector no disponible";

        return;

      }


      scanner =
        new Html5Qrcode(
          "reader"
        );


      try {

        await scanner.start(

          {
            facingMode:
              "environment"
          },

          {

            fps: 10,

            qrbox: {

              width: 210,

              height: 210

            },

            aspectRatio: 1.0

          },

          function(decodedText) {

            console.log(
              "QR:",
              decodedText
            );


            procesarQR(
              decodedText
            );

          },

          function(errorMessage) {

            /*
              Errores normales durante
              la búsqueda de QR.
            */

          }

        );


        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Cámara activa";

      }
      catch(error) {

        console.error(
          "Error de cámara:",
          error
        );


        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Error";


        mostrarResultado(
          "📷",
          "No se pudo iniciar la cámara",
          "Revisa el permiso de cámara del navegador.",
          "error"
        );

      }

    }


    /* =====================================================
       EVENTO ONLINE
       ===================================================== */

    window.addEventListener(
      "online",
      async function() {

        actualizarConexion();

        await cargarAlumnos();

        await sincronizarPendientes();

        await actualizarResumenAsistencia();

      }
    );


    /* =====================================================
       EVENTO OFFLINE
       ===================================================== */

    window.addEventListener(
      "offline",
      function() {

        actualizarConexion();


        mostrarResultado(
          "📱",
          "Modo sin conexión",
          "Las nuevas asistencias se guardarán en este dispositivo.",
          "offline"
        );

      }
    );


    /* =====================================================
       BOTÓN DE SINCRONIZACIÓN
       ===================================================== */

    document.getElementById(
      "syncButton"
    ).addEventListener(
      "click",
      sincronizarPendientes
    );


    /* =====================================================
       INICIO DE APLICACIÓN
       ===================================================== */

    async function iniciarAplicacion() {

      try {

        await abrirBaseDatos();


        actualizarConexion();


        await cargarAlumnos();


        await actualizarPendientes();


        if (navigator.onLine) {

          await sincronizarPendientes();

          await actualizarResumenAsistencia();

        }


        await iniciarCamara();

      }
      catch(error) {

        console.error(
          "Error iniciando aplicación:",
          error
        );

      }

    }


    window.addEventListener(
      "load",
      iniciarAplicacion
    );


  </script>
