  <style>
     /* ==========================================
       RESET
       ========================================== */

    * {
      box-sizing: border-box;
    }


    html {
      width: 100%;
      min-height: 100%;
    }


    body {

      margin: 0;

      width: 100%;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #0f172a 0%,
          #172554 50%,
          #0f766e 100%
        );

      color: #0f172a;

      padding:
        clamp(8px, 2vw, 28px);

    }


    /* ==========================================
       CONTENEDOR
       ========================================== */

    .app {

      width: 100%;

      max-width: 820px;

      margin: 0 auto;

    }


    /* ==========================================
       ENCABEZADO
       ========================================== */

    .header {

      color: white;

      margin-bottom:
        clamp(10px, 2vw, 18px);

    }


    .header-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .title {

      margin: 0;

      font-size:
        clamp(21px, 4vw, 30px);

      font-weight: 750;

      line-height: 1.15;

      letter-spacing: -0.5px;

    }


    .subtitle {

      margin:
        5px 0 0;

      color: #cbd5e1;

      font-size:
        clamp(11px, 1.8vw, 14px);

    }


    /* ==========================================
       ESTADO DE CONEXIÓN
       ========================================== */

    .connection {

      display: flex;

      align-items: center;

      gap: 6px;

      padding:
        7px 11px;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.12);

      border:
        1px solid
        rgba(255,255,255,0.15);

      color: white;

      font-size:
        clamp(10px, 1.5vw, 12px);

      white-space: nowrap;

      flex-shrink: 0;

    }


    .connection-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #22c55e;

      flex-shrink: 0;

    }


    .connection.offline .connection-dot {

      background: #f59e0b;

    }


    /* ==========================================
       TARJETA PRINCIPAL
       ========================================== */

    .card {

      width: 100%;

      background:
        rgba(255,255,255,0.98);

      border-radius:
        clamp(16px, 3vw, 24px);

      padding:
        clamp(12px, 3vw, 26px);

      box-shadow:
        0 18px 40px

    }


    /* ==========================================
       ESTADÍSTICAS SUPERIORES
       ========================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        clamp(7px, 2vw, 12px);

      margin-bottom:
        clamp(11px, 2vw, 18px);

    }


    .stat {

      min-width: 0;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 13px;

      padding:
        clamp(9px, 2vw, 14px);

    }


    .stat-label {

      font-size:
        clamp(9px, 1.5vw, 11px);

      color: #64748b;

      margin-bottom: 3px;

    }


    .stat-value {

      font-size:
        clamp(18px, 3vw, 24px);

      font-weight: 750;

      color: #0f172a;

    }


    /* ==========================================
       RESUMEN DE ASISTENCIA
       ========================================== */

    .resumen-asistencia {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin:
        0 0 12px;

    }


    .tarjeta-resumen {

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding:
        14px 8px;

      text-align: center;

      box-shadow:
        0 2px 8px

    }


    .titulo-resumen {

      font-size: 12px;

      color: #64748b;

      margin-bottom: 5px;

    }


    .numero-resumen {

      font-size: 28px;

      font-weight: 750;

      color: #0f172a;

      line-height: 1;

    }


    /* ==========================================
       BARRA DE ASISTENCIA
       ========================================== */

    .barra-asistencia {

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding: 13px 14px;

      margin-bottom: 18px;

    }


    .barra-superior {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

      font-size: 13px;

      color: #475569;

    }


    .barra-superior strong {

      font-size: 15px;

      color: #0f172a;

    }


    .barra-fondo {

      width: 100%;

      height: 10px;

      background: #e2e8f0;

      border-radius: 10px;

      overflow: hidden;

    }


    .barra-progreso {

      height: 100%;

      width: 0%;

      background: #22c55e;

      border-radius: 10px;

      transition:
        width 0.3s ease;

    }


    /* ==========================================
       CABECERA DEL ESCÁNER
       ========================================== */

    .camera-header {

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

    }


    .camera-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 700;

      color: #1e293b;

    }


    .camera-status {

      font-size:
        clamp(10px, 1.5vw, 12px);

      color: #64748b;

    }


    /* ==========================================
       CÁMARA RESPONSIVA
       ========================================== */

    .camera-wrapper {

      width: 100%;

        0 8px 22px

      overflow: hidden;

    }


    #reader {

      width: 100%;

    }


    #reader video {

      width: 100% !important;

      max-width: 100% !important;

      border-radius: 14px !important;

      object-fit: cover !important;

    }


    #reader__scan_region {

      background: #020617 !important;

    }


    #reader__dashboard {

      background: #020617 !important;

      padding: 5px !important;

    }


    #reader__dashboard_section_swaplink {

      color: white !important;

    }


    /* ==========================================
       RESULTADO
       ========================================== */

    .result {

      width: 100%;

      margin-top:
        clamp(10px, 2vw, 14px);

      padding:
        clamp(10px, 2vw, 15px);

      min-height:
        clamp(64px, 10vw, 78px);

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      border-radius: 14px;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

    }


    .result-icon {

      font-size:
        clamp(20px, 3vw, 25px);

      margin-bottom: 2px;

    }


    .result-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 750;

      color: #334155;

      overflow-wrap: anywhere;

    }


    .result-detail {

      margin-top: 3px;

      font-size:
        clamp(11px, 1.7vw, 13px);

      color: #64748b;

      white-space: pre-line;

      overflow-wrap: anywhere;

    }


    .result.success {

      background: #ecfdf5;

      border-color: #a7f3d0;

    }


    .result.success .result-title {

      color: #047857;

    }


    .result.error {

      background: #fef2f2;

      border-color: #fecaca;

    }


    .result.error .result-title {

      color: #b91c1c;

    }


    .result.offline {

    }

    }


    /* ==========================================
       BOTÓN
       ========================================== */

    .sync-button {

      width: 100%;

        clamp(9px, 2vw, 12px);

      padding:

      border-radius: 11px;

      background: #0f172a;

      color: white;

      font-size:

      }


      .result {

    /* ==========================================
       PANTALLAS MUY PEQUEÑAS

      body {

    /* ==========================================
       DISPOSITIVOS TÁCTILES
       ========================================== */

    @media (pointer: coarse) {

      .sync-button {

        min-height: 46px;

      }

    }


  </style>

</head>

/* =========================================================

const API_URL =

function mostrarMensaje(texto, tipo = "info") {

  mensaje.textContent = texto;

  mensaje.className = "mensaje " + tipo;

}


function ocultarMensaje() {

  mensaje.className = "mensaje";

}


/* =========================================================
   CONEXIÓN
========================================================= */

function actualizarEstadoConexion() {

  if (navigator.onLine) {

    puntoEstado.classList.remove("offline");

    textoEstado.textContent = "Conectado";

  } else {

    puntoEstado.classList.add("offline");

    textoEstado.textContent = "Sin conexión";

  }

}


/* =========================================================
   INDEXEDDB
========================================================= */

function abrirDB() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open("AsistenciaQR", 1);

    request.onupgradeneeded = function(event) {

      const database = event.target.result;

      if (!database.objectStoreNames.contains("alumnos")) {

        database.createObjectStore(
          "alumnos",
          { keyPath: "idQR" }
        );

      }

      if (!database.objectStoreNames.contains("asistencias")) {

        const store =
          database.createObjectStore(
            "asistencias",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        store.createIndex(
          "estado",
          "estado",
          { unique: false }
        );

      }

    };

    request.onsuccess = function(event) {

      db = event.target.result;

      resolve(db);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   GUARDAR ALUMNOS
   IMPORTANTE:
   REEMPLAZA COMPLETAMENTE LA CACHÉ LOCAL
========================================================= */

function guardarAlumnos(alumnos) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readwrite"
      );

    const store =
      transaction.objectStore("alumnos");


    /*
      MUY IMPORTANTE:

      Primero eliminamos TODOS los alumnos
      guardados anteriormente.

      Así no quedan alumnos antiguos
      que ya no existen en Google Sheets.
    */

    const limpiar = store.clear();


    limpiar.onsuccess = function() {

      for (const alumno of alumnos) {

        store.put({

          idQR: alumno.idQR,

          nombre: alumno.nombre,

          grupo: alumno.grupo,

          activo: alumno.activo

        });

      }

    };


    transaction.oncomplete = function() {

      resolve();

    };


    transaction.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   OBTENER ALUMNOS LOCALES
========================================================= */

function obtenerTodosLosAlumnos() {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );

    const store =
      transaction.objectStore("alumnos");

    const request =
      store.getAll();

    request.onsuccess = function() {

      resolve(request.result || []);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   BUSCAR ALUMNO LOCAL
========================================================= */

function buscarAlumnoLocal(idQR) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );

    const store =
      transaction.objectStore("alumnos");

    const request =
      store.get(idQR);

    request.onsuccess = function() {

      resolve(request.result || null);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}

   GUARDAR ASISTENCIA OFFLINE
========================================================= */

    }

          "warning"
        );

        resolve(false);

        return;

      }


      store.add(registro);

    };


    request.onerror = function(event) {

      reject(event.target.error);

    };


    transaction.oncomplete = function() {

      resolve(true);

    };


    transaction.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   CONTAR PENDIENTES
========================================================= */

function actualizarPendientes() {

  return new Promise((resolve, reject) => {

    if (!db) {

      resolve();

      return;

    }

    const transaction =
      db.transaction(
        "asistencias",
        "readonly"
      );

    const store =
      transaction.objectStore("asistencias");

    const request =
      store.getAll();


    request.onsuccess = function() {

      const registros =
        request.result || [];

      const total =
        registros.filter(
          r => r.estado === "pendiente"
        ).length;


      pendientes.textContent = total;

      resolve();

    };


    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   CARGAR ALUMNOS DESDE GOOGLE SHEETS
========================================================= */

async function cargarAlumnosDesdeServidor() {

  if (!navigator.onLine) {

    return false;

  }


  try {

    const url =
      API_URL +
      "?action=alumnos&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "No se pudieron obtener los alumnos"
      );

    }


    /*
      Reemplazamos completamente
      la caché local.
    */

    await guardarAlumnos(
      data.alumnos || []
    );


    return true;

  } catch (error) {

    console.error(
      "Error cargando alumnos:",
      error
    );

    return false;

  }

}


/* =========================================================
   RESUMEN DE ASISTENCIA
   FUENTE PRINCIPAL = GOOGLE SHEETS
========================================================= */

async function actualizarResumenAsistencia() {

  if (!navigator.onLine) {

    return;

  }


  try {

    const url =
      API_URL +
      "?action=resumen&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "No se pudo obtener el resumen"
      );

    }


    /*
      MUY IMPORTANTE:

      Estos valores vienen directamente
      de Google Sheets.

      No usamos IndexedDB para determinar
      cuántos alumnos activos existen.
    */

    const activos =
      Number(data.totalActivos) || 0;

    const ingresados =
      Number(data.hanIngresado) || 0;

    const faltan =
      Number(data.faltan) || 0;

    const porcentaje =
      Number(data.porcentaje) || 0;


    /* ESTADÍSTICA SUPERIOR */

    totalActivos.textContent =
      activos;


    /* RESUMEN */

    resumenActivos.textContent =
      activos;

    hanIngresado.textContent =
      ingresados;

    faltanIngresar.textContent =
      faltan;

    porcentajeAsistencia.textContent =
      porcentaje + "%";


    barraProgreso.style.width =
      Math.min(
        100,
        Math.max(0, porcentaje)
      ) + "%";


    if (data.fecha) {

      fechaResumen.textContent =
        "Fecha: " +
        data.fecha;

    }


  } catch (error) {

    console.error(
      "Error actualizando resumen:",
      error
    );

  }

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(idQR) {

  if (procesandoQR) {

    return;

  }


  procesandoQR = true;


  try {

    idQR =
      String(idQR || "")
        .trim();


    if (!idQR) {

      return;

    }


    /* =====================================================
       MODO OFFLINE
    ===================================================== */

    if (!navigator.onLine) {

      const alumno =
        await buscarAlumnoLocal(idQR);


      if (!alumno) {

        mostrarMensaje(
          "QR no encontrado en la información disponible sin conexión.",
          "error"
        );

        return;

      }


      const activo =
        String(alumno.activo || "")
          .toLowerCase()
          .trim();


      if (
        activo !== "sí" &&
        activo !== "si"
      ) {

        mostrarMensaje(
          "Alumno inactivo.",
          "error"
        );

        return;

      }


      const guardado =
        await registrarOffline(
          alumno,
          idQR
        );


      if (guardado) {

        mostrarMensaje(
          "Asistencia registrada sin conexión. Se sincronizará automáticamente.",
          "warning"
        );

      }


      await actualizarPendientes();

      return;

    }


    /* =====================================================
       MODO ONLINE
    ===================================================== */

    mostrarMensaje(
      "Registrando asistencia...",
      "info"
    );


    const url =
      API_URL +
      "?idQR=" +
      encodeURIComponent(idQR) +
      "&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    /* ALUMNO REGISTRADO */

    if (data.ok) {

      mostrarMensaje(
        "✓ " +
        (data.nombre || "Alumno") +
        " — asistencia registrada correctamente.",
        "exito"
      );


      /*
        Actualizamos el resumen
        inmediatamente.
      */

      await actualizarResumenAsistencia();


      return;

    }


    /* DUPLICADO */

    if (data.duplicado) {

      mostrarMensaje(
        "Este alumno ya registró su asistencia hoy.",
        "warning"
      );


      await actualizarResumenAsistencia();

      return;

    }


    /* INACTIVO */

    if (
      data.inactivo ||
      data.error === "ALUMNO_INACTIVO"
    ) {

      mostrarMensaje(
        "Alumno inactivo. No se puede registrar la asistencia.",
        "error"
      );

      return;

    }


    /* QR NO ENCONTRADO */

    if (
      data.noEncontrado ||
      data.error === "ALUMNO_NO_ENCONTRADO"
    ) {

      mostrarMensaje(
        "QR no encontrado. Verifica que el alumno esté registrado.",
        "error"
      );

      return;

    }


    /* OTRO ERROR */

    mostrarMensaje(
      data.error ||
      "No se pudo registrar la asistencia.",
      "error"
    );


  } catch (error) {

    console.error(
      "Error procesando QR:",
      error
    );


    /*
      Si perdimos la conexión justo durante
      el registro, intentamos trabajar offline.
    */

    if (!navigator.onLine) {

      try {

        const alumno =
          await buscarAlumnoLocal(idQR);


        if (alumno) {

          const activo =
            String(alumno.activo || "")
              .toLowerCase()
              .trim();


          if (
            activo === "sí" ||
            activo === "si"
          ) {

            const guardado =
              await registrarOffline(
                alumno,
                idQR
              );


            if (guardado) {

              mostrarMensaje(
                "Se perdió la conexión. La asistencia quedó guardada para sincronizarse.",
                "warning"
              );

            }

          } else {

            mostrarMensaje(
              "Alumno inactivo.",
              "error"
            );

          }

        } else {

          mostrarMensaje(
            "No hay conexión y el alumno no está disponible en la información local.",
            "error"
          );

        }


      } catch (offlineError) {

        console.error(
          offlineError
        );

        mostrarMensaje(
          "No se pudo registrar la asistencia.",
          "error"
        );

      }


    } else {

      mostrarMensaje(
        "Error de comunicación con el servidor.",
        "error"
      );

    }

  } finally {

    /*
      Pequeño bloqueo para evitar que
      una misma lectura QR se procese
      varias veces inmediatamente.
    */

    setTimeout(() => {

      procesandoQR = false;

    }, 1200);

  }

}


/* =========================================================
   SINCRONIZAR PENDIENTES
========================================================= */

async function sincronizarPendientes() {

  if (!navigator.onLine) {

    return;

  }


  if (!db) {

    return;

  }


  try {

    const transaction =
      db.transaction(
        "asistencias",
        "readwrite"
      );

    const store =
      transaction.objectStore("asistencias");


    const registros =
      await new Promise(
        (resolve, reject) => {

          const request =
            store.getAll();

          request.onsuccess =
            () => resolve(
              request.result || []
            );

          request.onerror =
            () => reject(
              request.error
            );

        }
      );


    const pendientesLocal =
      registros.filter(
        r => r.estado === "pendiente"
      );


    for (
      const registro
      of pendientesLocal
    ) {

      try {

        const params =
          new URLSearchParams({

            action: "registrar",

            idQR: registro.idQR,

            nombre: registro.nombre,

            grupo: registro.grupo,

            fecha: registro.fecha,

            hora: registro.hora

          });


        const response =
          await fetch(
            API_URL +
            "?" +
            params.toString() +
            "&t=" +
            Date.now()
          );


        if (!response.ok) {

          continue;

        }


        const data =
          await response.json();


        /*
          Si se registró correctamente
          o ya estaba registrado,
          eliminamos el pendiente local.
        */

        if (
          data.ok ||
          data.duplicado
        ) {

          store.delete(
            registro.id
          );

        }


        /*
          Si el alumno está inactivo,
          también eliminamos el pendiente.
        */

        else if (
          data.inactivo ||
          data.error === "ALUMNO_INACTIVO"
        ) {

          store.delete(
            registro.id
          );

        }

      } catch (error) {

        console.error(
          "Error sincronizando registro:",
          error
        );

      }

    }


    await actualizarPendientes();

    await actualizarResumenAsistencia();


  } catch (error) {

    console.error(
      "Error en sincronización:",
      error
    );

  }

}


/* =========================================================
   CÁMARA
========================================================= */

async function iniciarCamara() {

  try {

    if (scanner) {

      return;

    }


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 210,
          height: 210
        },

        aspectRatio: 1.0

      },

      decodedText => {

        procesarQR(decodedText);

      },

      errorMessage => {

        /*
          No mostramos errores de lectura
          continuamente porque son normales
          mientras la cámara busca un QR.
        */

      }

    );


  } catch (error) {

    console.error(
      "Error iniciando cámara:",
      error
    );


    mostrarMensaje(
      "No se pudo iniciar la cámara. Verifica que el navegador tenga permiso para usarla.",
      "error"
    );

  }

}


/* =========================================================
   EVENTO ONLINE
========================================================= */

window.addEventListener(
  "online",
  async function() {

    actualizarEstadoConexion();


    mostrarMensaje(
      "Conexión restablecida. Actualizando información...",
      "info"
    );


    /*
      Primero descargamos la lista actual
      de Google Sheets.
    */

    await cargarAlumnosDesdeServidor();


    /*
      Después sincronizamos pendientes.
    */

    await sincronizarPendientes();


    /*
      Finalmente actualizamos el resumen.
    */

    await actualizarResumenAsistencia();


    await actualizarPendientes();


    setTimeout(
      ocultarMensaje,
      2500
    );

  }
);


/* =========================================================
   EVENTO OFFLINE
========================================================= */

window.addEventListener(
  "offline",
  function() {

    actualizarEstadoConexion();


    mostrarMensaje(
      "Sin conexión. Las asistencias se guardarán localmente y se sincronizarán al recuperar Internet.",
      "warning"
    );

  }
);


/* =========================================================
   INICIALIZACIÓN
========================================================= */

async function iniciarAplicacion() {

  try {

    /* Abrir IndexedDB */

    await abrirDB();


    /* Estado de conexión */

    actualizarEstadoConexion();


    /*
      Si tenemos Internet:

      1. Descargar alumnos actuales
      2. Reemplazar caché local
      3. Sincronizar pendientes
      4. Actualizar resumen
    */

    if (navigator.onLine) {

      await cargarAlumnosDesdeServidor();

      await sincronizarPendientes();

      await actualizarResumenAsistencia();

    } else {

      /*
        Sin Internet solamente podemos
        trabajar con la información local.
      */

      await actualizarPendientes();

      mostrarMensaje(
        "Trabajando sin conexión. Los registros se sincronizarán cuando vuelva Internet.",
        "warning"
      );

    }


    /*
      Mostrar pendientes
    */

    await actualizarPendientes();


    /*
      Iniciar cámara
    */

    await iniciarCamara();


  } catch (error) {

    console.error(
      "Error iniciando aplicación:",
      error
    );


    mostrarMensaje(
      "No se pudo iniciar correctamente la aplicación.",
      "error"
    );

  }

}


/* =========================================================
   ARRANCAR
========================================================= */

window.addEventListener(
  "load",
  iniciarAplicacion
);

</script>
