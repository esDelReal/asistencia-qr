<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Ludwig Van Beethoven</title>


  <!-- ==========================================
       LECTOR QR
       ========================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {

      margin: 0;

      width: 100%;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #0f172a 0%,
          #172554 50%,
          #0f766e 100%
        );

      color: #0f172a;

      padding:
        clamp(8px, 2vw, 28px);

    }


    /* ==========================================
       CONTENEDOR
       ========================================== */

    .app {

      width: 100%;

      max-width: 820px;

      margin: 0 auto;

    }


    /* ==========================================
       ENCABEZADO
       ========================================== */

    .header {

      color: white;

      margin-bottom:
        clamp(10px, 2vw, 18px);

    }


    .header-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .title {

      margin: 0;

      font-size:
        clamp(21px, 4vw, 30px);

      font-weight: 750;

      line-height: 1.15;

      letter-spacing: -0.5px;

    }


    .subtitle {

      margin:
        5px 0 0;

      color: #cbd5e1;

      font-size:
        clamp(11px, 1.8vw, 14px);

    }


    /* ==========================================
       ESTADO DE CONEXIÓN
       ========================================== */

    .connection {

      display: flex;

      align-items: center;

      gap: 6px;

      padding:
        7px 11px;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.12);

      border:
        1px solid
        rgba(255,255,255,0.15);

      color: white;

      font-size:
        clamp(10px, 1.5vw, 12px);

      white-space: nowrap;

      flex-shrink: 0;

    }


    .connection-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #22c55e;

      flex-shrink: 0;

    }


    .connection.offline .connection-dot {

      background: #f59e0b;

    }


    /* ==========================================
       TARJETA
       ========================================== */

    .card {

      width: 100%;

      background:
        rgba(255,255,255,0.98);

      border-radius:
        clamp(16px, 3vw, 24px);

      padding:
        clamp(12px, 3vw, 26px);

      box-shadow:
        0 18px 40px
        rgba(0,0,0,0.25);

    }


    /* ==========================================
       ESTADÍSTICAS
       ========================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        clamp(7px, 2vw, 12px);

      margin-bottom:
        clamp(11px, 2vw, 18px);

    }


    .stat {

      min-width: 0;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 13px;

      padding:
        clamp(9px, 2vw, 14px);

    }


    .stat-label {

      font-size:
        clamp(9px, 1.5vw, 11px);

      color: #64748b;

      margin-bottom: 3px;

    }


    .stat-value {

      font-size:
        clamp(18px, 3vw, 24px);

      font-weight: 750;

      color: #0f172a;

    }


    /* ==========================================
       RESUMEN
       ========================================== */

    .resumen-asistencia {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin:
        0 0 12px;

    }


    .tarjeta-resumen {

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding:
        14px 8px;

      text-align: center;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.06);

    }


    .titulo-resumen {

      font-size: 12px;

      color: #64748b;

      margin-bottom: 5px;

    }


    .numero-resumen {

      font-size: 28px;

      font-weight: 750;

      color: #0f172a;

      line-height: 1;

    }


    /* ==========================================
       BARRA
       ========================================== */

    .barra-asistencia {

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      border-radius: 14px;

      padding: 13px 14px;

      margin-bottom: 18px;

    }


    .barra-superior {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

      font-size: 13px;

      color: #475569;

    }


    .barra-superior strong {

      font-size: 15px;

      color: #0f172a;

    }


    .barra-fondo {

      width: 100%;

      height: 10px;

      background: #e2e8f0;

      border-radius: 10px;

      overflow: hidden;

    }


    .barra-progreso {

      height: 100%;

      width: 0%;

      background: #22c55e;

      border-radius: 10px;

      transition:
        width 0.3s ease;

    }


    /* ==========================================
       CÁMARA
       ========================================== */

    .camera-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 8px;

    }


    .camera-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 700;

      color: #1e293b;

    }


    .camera-status {

      font-size:
        clamp(10px, 1.5vw, 12px);

      color: #64748b;

      text-align: right;

    }


    .camera-wrapper {

      width: 100%;

      max-width:
        min(460px, 78vw);

      margin:
        0 auto;

      padding: 4px;

      background: #020617;

      border-radius:
        clamp(15px, 3vw, 20px);

      box-shadow:
        0 8px 22px
        rgba(15,23,42,0.20);

      overflow: hidden;

    }


    #reader {

      width: 100%;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      max-width: 100% !important;

      border-radius: 14px !important;

      object-fit: cover !important;

    }


    #reader__scan_region {

      background: #020617 !important;

    }


    #reader__dashboard {

      background: #020617 !important;

      padding: 5px !important;

    }


    #reader__dashboard_section_swaplink {

      color: white !important;

    }


    /* ==========================================
       RESULTADO
       ========================================== */

    .result {

      width: 100%;

      margin-top:
        clamp(10px, 2vw, 14px);

      padding:
        clamp(10px, 2vw, 15px);

      min-height:
        clamp(64px, 10vw, 78px);

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      border-radius: 14px;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

    }


    .result-icon {

      font-size:
        clamp(20px, 3vw, 25px);

      margin-bottom: 2px;

    }


    .result-title {

      font-size:
        clamp(13px, 2vw, 16px);

      font-weight: 750;

      color: #334155;

      overflow-wrap: anywhere;

    }


    .result-detail {

      margin-top: 3px;

      font-size:
        clamp(11px, 1.7vw, 13px);

      color: #64748b;

      white-space: pre-line;

      overflow-wrap: anywhere;

    }


    .result.success {

      background: #ecfdf5;

      border-color: #a7f3d0;

    }


    .result.success .result-title {

      color: #047857;

    }


    .result.error {

      background: #fef2f2;

      border-color: #fecaca;

    }


    .result.error .result-title {

      color: #b91c1c;

    }


    .result.offline {

      background: #fffbeb;

      border-color: #fde68a;

    }


    .result.offline .result-title {

      color: #92400e;

    }


    /* ==========================================
       BOTÓN
       ========================================== */

    .sync-button {

      width: 100%;

      min-height: 44px;

      margin-top:
        clamp(9px, 2vw, 12px);

      padding:
        10px 14px;

      border: 0;

      border-radius: 11px;

      background: #0f172a;

      color: white;

      font-size:
        clamp(11px, 1.7vw, 13px);

      font-weight: 650;

      cursor: pointer;

    }


    .sync-button:disabled {

      opacity: 0.45;

      cursor: default;

    }


    /* ==========================================
       PIE
       ========================================== */

    .footer {

      text-align: center;

      margin-top:
        clamp(9px, 2vw, 13px);

      color: #94a3b8;

      font-size:
        clamp(9px, 1.4vw, 11px);

    }


    /* ==========================================
       RESPONSIVE
       ========================================== */

    @media (max-width: 380px) {

      body {
        padding: 8px;
      }

      .header-row {
        gap: 8px;
        align-items: flex-start;
      }

      .title {
        font-size: 20px;
      }

      .subtitle {
        font-size: 11px;
      }

      .connection {
        padding: 6px 8px;
        font-size: 10px;
      }

      .card {
        padding: 11px;
      }

      .camera-wrapper {
        max-width: 300px;
      }

      .numero-resumen {
        font-size: 23px;
      }

      .titulo-resumen {
        font-size: 10px;
      }

    }


    @media (
      min-width: 381px
    ) and (
      max-width: 599px
    ) {

      .camera-wrapper {
        max-width: 340px;
      }

    }


    @media (min-width: 600px) {

      .camera-wrapper {
        max-width: 400px;
      }

      .card {
        padding: 22px;
      }

    }


    @media (min-width: 900px) {

      .app {
        max-width: 820px;
      }

      .camera-wrapper {
        max-width: 440px;
      }

      .card {
        padding: 26px;
      }

    }


    @media (min-width: 1200px) {

      .app {
        max-width: 850px;
      }

      .camera-wrapper {
        max-width: 460px;
      }

    }


    @media (
      max-height: 600px
    ) and (
      orientation: landscape
    ) {

      body {
        padding: 8px 14px;
      }

      .header {
        margin-bottom: 7px;
      }

      .title {
        font-size: 20px;
      }

      .subtitle {
        display: none;
      }

      .card {
        padding: 10px 14px;
      }

      .stats {
        margin-bottom: 7px;
      }

      .camera-wrapper {
        max-width: 300px;
      }

      .result {
        margin-top: 7px;
        min-height: 54px;
        padding: 7px;
      }

      .footer {
        display: none;
      }

    }


    @media (max-width: 320px) {

      body {
        padding: 5px;
      }

      .title {
        font-size: 18px;
      }

      .connection {
        font-size: 9px;
        padding: 5px 7px;
      }

      .card {
        padding: 9px;
        border-radius: 15px;
      }

      .camera-wrapper {
        max-width: 285px;
      }

      .result {
        padding: 8px;
      }

      .resumen-asistencia {
        gap: 4px;
      }

      .numero-resumen {
        font-size: 21px;
      }

    }


    @media (pointer: coarse) {

      .sync-button {
        min-height: 46px;
      }

    }

  </style>

</head>


<body>

  <script>

    /* =====================================================
       CONFIGURACIÓN
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


    /* =====================================================
       VARIABLES
       ===================================================== */

    let scanner = null;

    let procesando = false;

    let sincronizando = false;

    let db = null;

    let internetReal = false;

    let ultimaVerificacionInternet = 0;


    /*
     * Tiempo máximo de espera para una petición
     * al servidor.
     *
     * Si el servidor no responde, la asistencia
     * se guarda automáticamente en el dispositivo.
     */

    const TIMEOUT_RED = 3500;


    /* =====================================================
       BASE DE DATOS
       ===================================================== */

    const DB_NAME =
      "AsistenciaQR";

    const DB_VERSION =
      1;


    /* =====================================================
       ABRIR BASE DE DATOS
       ===================================================== */

    function abrirBaseDatos() {

      return new Promise(
        function(resolve, reject) {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            function(event) {

              const database =
                event.target.result;


              if (
                !database.objectStoreNames.contains(
                  "alumnos"
                )
              ) {

                database.createObjectStore(
                  "alumnos",
                  {
                    keyPath: "idQR"
                  }
                );

              }


              if (
                !database.objectStoreNames.contains(
                  "asistencias"
                )
              ) {

                const store =
                  database.createObjectStore(
                    "asistencias",
                    {
                      keyPath: "id",
                      autoIncrement: true
                    }
                  );


                store.createIndex(
                  "estado",
                  "estado",
                  {
                    unique: false
                  }
                );

              }

            };


          request.onsuccess =
            function(event) {

              db =
                event.target.result;


              /*
               * Si IndexedDB se cierra inesperadamente,
               * intentamos mantener la aplicación operativa.
               */

              db.onversionchange =
                function() {

                  db.close();

                };


              resolve(db);

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       GUARDAR ALUMNOS
       ===================================================== */

    function guardarAlumnos(alumnos) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve();

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          /*
           * Eliminamos la caché anterior.
           *
           * Así un alumno eliminado de Google Sheets
           * no permanece en el dispositivo.
           */

          store.clear();


          /*
           * Guardamos solamente la lista actual.
           */

          alumnos.forEach(
            function(alumno) {

              store.put({

                idQR:
                  String(
                    alumno.idQR || ""
                  ).trim(),

                nombre:
                  alumno.nombre || "",

                grupo:
                  alumno.grupo || "",

                activo:
                  alumno.activo || ""

              });

            }
          );


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER ALUMNO LOCAL
       ===================================================== */

    function obtenerAlumnoLocal(idQR) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve(null);

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          const request =
            store.get(
              String(idQR).trim()
            );


          request.onsuccess =
            function() {

              resolve(
                request.result ||
                null
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER TODOS LOS ALUMNOS
       ===================================================== */

    function obtenerTodosLosAlumnos() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "alumnos",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "alumnos"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER ASISTENCIAS
       ===================================================== */

    function obtenerTodasLasAsistencias() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          const request =
            store.getAll();


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       GUARDAR ASISTENCIA LOCAL
       ===================================================== */

    function guardarAsistenciaLocal(
      asistencia
    ) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            reject(
              new Error(
                "IndexedDB no está disponible."
              )
            );

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          store.add(
            asistencia
          );


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       OBTENER PENDIENTES
       ===================================================== */

    function obtenerPendientes() {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve([]);

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readonly"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          /*
           * Utilizamos el índice estado.
           *
           * Esto es más eficiente que getAll()
           * y filtrar después.
           */

          const indice =
            store.index(
              "estado"
            );


          const request =
            indice.getAll(
              "pendiente"
            );


          request.onsuccess =
            function() {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }


    /* =====================================================
       ACTUALIZAR PENDIENTES
       ===================================================== */

    async function actualizarPendientes() {

      try {

        const pendientes =
          await obtenerPendientes();


        document.getElementById(
          "pendientes"
        ).textContent =
          pendientes.length;


        document.getElementById(
          "syncButton"
        ).disabled =
          pendientes.length === 0;


      }
      catch(error) {

        console.error(
          "Error actualizando pendientes:",
          error
        );

      }

    }


    /* =====================================================
       MOSTRAR RESULTADO
       ===================================================== */

    function mostrarResultado(
      icono,
      titulo,
      detalle,
      clase
    ) {

      const resultado =
        document.getElementById(
          "resultado"
        );


      resultado.className =
        "result " + clase;


      resultado.innerHTML =

        "<div>" +

          '<div class="result-icon">' +
            icono +
          "</div>" +

          '<div class="result-title">' +
            titulo +
          "</div>" +

          '<div class="result-detail">' +
            detalle +
          "</div>" +

        "</div>";

    }


    /* =====================================================
       CONEXIÓN
       ===================================================== */

    function actualizarConexion() {

      const status =
        document.getElementById(
          "connectionStatus"
        );


      const texto =
        document.getElementById(
          "connectionText"
        );


      if (
        navigator.onLine &&
        internetReal
      ) {

        status.classList.remove(
          "offline"
        );


        texto.textContent =
          "Conectado";

      }
      else {

        status.classList.add(
          "offline"
        );


        texto.textContent =
          "Sin conexión";

      }

    }


    /* =====================================================
       CARGAR ALUMNOS
       ===================================================== */

    async function cargarAlumnos() {

      /*
       * OFFLINE:
       *
       * No hacemos ninguna petición.
       */

      if (!navigator.onLine) {

        await actualizarTotalAlumnos();

        return;

      }


      try {

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function() {

              controller.abort();

            },
            TIMEOUT_RED
          );


        const response =
          await fetch(
            API_URL +
            "?action=alumnos&t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store",
              signal:
                controller.signal
            }
          );


        clearTimeout(
          timeout
        );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (
          data.ok &&
          Array.isArray(
            data.alumnos
          )
        ) {

          await guardarAlumnos(
            data.alumnos
          );


          internetReal =
            true;


          actualizarConexion();

        }

      }
      catch(error) {

        console.log(
          "No fue posible actualizar alumnos:",
          error
        );


        /*
         * No borramos la caché local.
         *
         * Se conserva para poder trabajar offline.
         */

        internetReal =
          false;


        await actualizarTotalAlumnos();

        actualizarConexion();

      }

    }


    /* =====================================================
       CONTAR ALUMNOS ACTIVOS
       ===================================================== */

    async function actualizarTotalAlumnos() {

      try {

        const alumnos =
          await obtenerTodosLosAlumnos();


        const activos =
          alumnos.filter(
            function(alumno) {

              const estado =
                String(
                  alumno.activo || ""
                )
                .trim()
                .toLowerCase();


              return (
                estado === "sí" ||
                estado === "si"
              );

            }
          );


        document.getElementById(
          "totalAlumnos"
        ).textContent =
          activos.length;

      }
      catch(error) {

        console.error(
          "Error contando alumnos:",
          error
        );

      }

    }


    /* =====================================================
       FECHA
       ===================================================== */

    function obtenerFecha() {

      const ahora =
        new Date();


      const dia =
        String(
          ahora.getDate()
        ).padStart(
          2,
          "0"
        );


      const mes =
        String(
          ahora.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const año =
        ahora.getFullYear();


      return (
        dia +
        "/" +
        mes +
        "/" +
        año
      );

    }


    /* =====================================================
       HORA
       ===================================================== */

    function obtenerHora() {

      const ahora =
        new Date();


      const horas =
        String(
          ahora.getHours()
        ).padStart(
          2,
          "0"
        );


      const minutos =
        String(
          ahora.getMinutes()
        ).padStart(
          2,
          "0"
        );


      const segundos =
        String(
          ahora.getSeconds()
        ).padStart(
          2,
          "0"
        );


      return (
        horas +
        ":" +
        minutos +
        ":" +
        segundos
      );

    }


    /* =====================================================
       RESUMEN
       ===================================================== */

    async function actualizarResumenAsistencia() {

      if (!navigator.onLine) {

        return;

      }


      try {

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function() {

              controller.abort();

            },
            TIMEOUT_RED
          );


        const response =
          await fetch(
            API_URL +
            "?action=resumen&t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store",
              signal:
                controller.signal
            }
          );


        clearTimeout(
          timeout
        );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!data.ok) {

          return;

        }


        internetReal =
          true;


        const total =
          Number(
            data.totalActivos
          ) || 0;


        const ingresados =
          Number(
            data.hanIngresado
          ) || 0;


        const faltan =
          Number(
            data.faltan
          ) || 0;


        const porcentaje =
          Number(
            data.porcentaje
          ) || 0;


        document.getElementById(
          "totalAlumnos"
        ).textContent =
          total;


        document.getElementById(
          "totalActivos"
        ).textContent =
          total;


        document.getElementById(
          "hanIngresado"
        ).textContent =
          ingresados;


        document.getElementById(
          "faltanIngresar"
        ).textContent =
          faltan;


        document.getElementById(
          "porcentajeAsistencia"
        ).textContent =
          porcentaje +
          "%";


        document.getElementById(
          "barraProgreso"
        ).style.width =
          Math.min(
            100,
            Math.max(
              0,
              porcentaje
            )
          ) +
          "%";


        actualizarConexion();

      }
      catch(error) {

        console.log(
          "No se pudo actualizar el resumen:",
          error
        );

      }

    }


    /* =====================================================
       DUPLICADO LOCAL
       ===================================================== */

    async function verificarDuplicadoLocal(
      idQR,
      fecha
    ) {

      const asistencias =
        await obtenerTodasLasAsistencias();


      return asistencias.some(
        function(item) {

          return (
            String(item.idQR).trim() ===
              String(idQR).trim() &&
            item.fecha ===
              fecha
          );

        }
      );

    }


    /* =====================================================
       REGISTRAR OFFLINE
       ===================================================== */

    async function registrarOffline(
      idQR
    ) {

      try {

        const alumno =
          await obtenerAlumnoLocal(
            idQR
          );


        /* ==========================================
           NO ENCONTRADO
           ========================================== */

        if (!alumno) {

          mostrarResultado(
            "❌",
            "Código no registrado",
            "Este alumno no está disponible en la información local del dispositivo.",
            "error"
          );

          return;

        }


        /* ==========================================
           ACTIVO
           ========================================== */

        const activo =
          String(
            alumno.activo || ""
          )
          .trim()
          .toLowerCase();


        if (
          activo !== "sí" &&
          activo !== "si"
        ) {

          mostrarResultado(
            "🚫",
            "Alumno inactivo",
            alumno.nombre +
            " · " +
            alumno.grupo +
            "\nNo tiene autorización para registrar asistencia.",
            "error"
          );

          return;

        }


        /* ==========================================
           FECHA / HORA
           ========================================== */

        const fecha =
          obtenerFecha();


        const hora =
          obtenerHora();


        /* ==========================================
           DUPLICADO
           ========================================== */

        const duplicado =
          await verificarDuplicadoLocal(
            idQR,
            fecha
          );


        if (duplicado) {

          mostrarResultado(
            "⚠️",
            "Asistencia duplicada",
            alumno.nombre +
            " · " +
            alumno.grupo +
            "\nYa fue registrado hoy.",
            "error"
          );

          return;

        }


        /* ==========================================
           GUARDAR
           ========================================== */

        await guardarAsistenciaLocal({

          idQR:
            String(idQR).trim(),

          nombre:
            alumno.nombre,

          grupo:
            alumno.grupo,

          fecha:
            fecha,

          hora:
            hora,

          estado:
            "pendiente"

        });


        await actualizarPendientes();


        mostrarResultado(
          "📱",
          "Asistencia guardada",
          alumno.nombre +
          " · " +
          alumno.grupo +
          "\nSin conexión. Se sincronizará automáticamente.",
          "offline"
        );

      }
      catch(error) {

        console.error(
          "Error guardando offline:",
          error
        );


        mostrarResultado(
          "❌",
          "Error local",
          "No fue posible guardar la asistencia en el dispositivo.",
          "error"
        );

      }

    }


    /* =====================================================
       PROCESAR QR
       ===================================================== */

    async function procesarQR(
      idQR
    ) {

      /*
       * Evita que el mismo QR sea procesado
       * varias veces por la cámara.
       */

      if (procesando) {

        return;

      }


      procesando =
        true;


      try {

        idQR =
          String(
            idQR || ""
          ).trim();


        if (!idQR) {

          return;

        }


        /* ==========================================
           OFFLINE DIRECTO
           ========================================== */

        if (!navigator.onLine) {

          internetReal =
            false;


          actualizarConexion();


          await registrarOffline(
            idQR
          );


          return;

        }


        /* ==========================================
           INTENTAR SERVIDOR
           ========================================== */

        mostrarResultado(
          "⏳",
          "Procesando...",
          "Validando asistencia",
          ""
        );


        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function() {

              controller.abort();

            },
            TIMEOUT_RED
          );


        try {

          const url =
            API_URL +
            "?idQR=" +
            encodeURIComponent(
              idQR
            ) +
            "&t=" +
            Date.now();


          const response =
            await fetch(
              url,
              {
                method: "GET",
                cache: "no-store",
                signal:
                  controller.signal
              }
            );


          clearTimeout(
            timeout
          );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          const data =
            await response.json();


          internetReal =
            true;


          actualizarConexion();


          console.log(
            "Respuesta servidor:",
            data
          );


          /* ========================================
             CORRECTO
             ======================================== */

          if (data.ok) {

            mostrarResultado(
              "✓",
              "Asistencia registrada",
              data.nombre +
              " · " +
              data.grupo +
              "\n" +
              data.hora,
              "success"
            );


            /*
             * No esperamos al resumen para liberar
             * el siguiente escaneo.
             */

            actualizarResumenAsistencia();

          }


          /* ========================================
             INACTIVO
             ======================================== */

          else if (data.inactivo) {

            mostrarResultado(
              "🚫",
              "Alumno inactivo",
              data.nombre +
              " · " +
              data.grupo +
              "\n" +
              data.mensaje,
              "error"
            );

          }


          /* ========================================
             DUPLICADO
             ======================================== */

          else if (data.duplicado) {

            mostrarResultado(
              "⚠️",
              "Asistencia duplicada",
              data.mensaje,
              "error"
            );

          }


          /* ========================================
             DESCONOCIDO
             ======================================== */

          else {

            mostrarResultado(
              "❌",
              "Código no registrado",
              data.mensaje ||
              "El código QR no está registrado.",
              "error"
            );

          }

        }
        catch(error) {

          clearTimeout(
            timeout
          );


          console.log(
            "Servidor no disponible:",
            error
          );


          /*
           * AQUÍ ESTÁ LA MEJORA PRINCIPAL:
           *
           * Si Google Apps Script no responde,
           * guardamos automáticamente en IndexedDB.
           */

          internetReal =
            false;


          actualizarConexion();


          await registrarOffline(
            idQR
          );

        }

      }
      catch(error) {

        console.error(
          "Error procesando QR:",
          error
        );


        mostrarResultado(
          "❌",
          "Error",
          "No fue posible procesar el código QR.",
          "error"
        );

      }
      finally {

        /*
         * Antes eran 1500 ms.
         *
         * Ahora permitimos escanear mucho más rápido.
         */

        setTimeout(
          function() {

            procesando =
              false;

          },
          600
        );

      }

    }


    /* =====================================================
       ELIMINAR ASISTENCIA LOCAL
       ===================================================== */

    function eliminarAsistencia(
      id
    ) {

      return new Promise(
        function(resolve, reject) {

          if (!db) {

            resolve();

            return;

          }


          const transaction =
            db.transaction(
              "asistencias",
              "readwrite"
            );


          const store =
            transaction.objectStore(
              "asistencias"
            );


          store.delete(
            id
          );


          transaction.oncomplete =
            function() {

              resolve();

            };


          transaction.onerror =
            function() {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =====================================================
       SINCRONIZAR PENDIENTES
       ===================================================== */

    async function sincronizarPendientes() {

      /*
       * Evita dos procesos simultáneos.
       */

      if (sincronizando) {

        return;

      }


      /*
       * Sin Internet:
       * no intentamos nada.
       */

      if (!navigator.onLine) {

        await actualizarPendientes();

        return;

      }


      sincronizando =
        true;


      const boton =
        document.getElementById(
          "syncButton"
        );


      try {

        const pendientes =
          await obtenerPendientes();


        if (
          pendientes.length === 0
        ) {

          await actualizarPendientes();

          return;

        }


        boton.disabled =
          true;


        boton.textContent =
          "Sincronizando " +
          pendientes.length +
          "...";


        for (
          const asistencia of pendientes
        ) {

          /*
           * Si se pierde Internet,
           * conservamos todos los pendientes.
           */

          if (!navigator.onLine) {

            break;

          }


          try {

            const controller =
              new AbortController();


            const timeout =
              setTimeout(
                function() {

                  controller.abort();

                },
                TIMEOUT_RED
              );


            const url =
              API_URL +
              "?action=registrar" +
              "&idQR=" +
              encodeURIComponent(
                asistencia.idQR
              ) +
              "&nombre=" +
              encodeURIComponent(
                asistencia.nombre
              ) +
              "&grupo=" +
              encodeURIComponent(
                asistencia.grupo
              ) +
              "&fecha=" +
              encodeURIComponent(
                asistencia.fecha
              ) +
              "&hora=" +
              encodeURIComponent(
                asistencia.hora
              ) +
              "&t=" +
              Date.now();


            const response =
              await fetch(
                url,
                {
                  method: "GET",
                  cache: "no-store",
                  signal:
                    controller.signal
                }
              );


            clearTimeout(
              timeout
            );


            if (!response.ok) {

              throw new Error(
                "HTTP " +
                response.status
              );

            }


            const data =
              await response.json();


            console.log(
              "Sincronización:",
              data
            );


            /*
             * REGISTRADO CORRECTAMENTE
             */

            if (data.ok) {

              await eliminarAsistencia(
                asistencia.id
              );

            }


            /*
             * YA EXISTÍA
             */

            else if (
              data.duplicado
            ) {

              /*
               * Si ya existe en servidor,
               * no necesitamos conservarlo localmente.
               */

              await eliminarAsistencia(
                asistencia.id
              );

            }


            /*
             * ALUMNO INACTIVO
             */

            else if (
              data.inactivo
            ) {

              /*
               * El servidor confirma que ya no
               * está autorizado.
               */

              await eliminarAsistencia(
                asistencia.id
              );

            }


            /*
             * OTRO ERROR
             *
             * NO ELIMINAMOS.
             */

            else {

              console.log(
                "Pendiente conservado:",
                asistencia
              );

            }

          }
          catch(error) {

            console.log(
              "Sincronización detenida:",
              error
            );


            /*
             * Conservamos este registro
             * y todos los siguientes.
             */

            internetReal =
              false;


            break;

          }

        }

      }
      catch(error) {

        console.error(
          "Error sincronizando:",
          error
        );

      }
      finally {

        sincronizando =
          false;


        await actualizarPendientes();


        if (navigator.onLine) {

          actualizarResumenAsistencia();

        }


        boton.textContent =
          "Sincronizar pendientes";

      }

    }


    /* =====================================================
       INICIAR CÁMARA
       ===================================================== */

    async function iniciarCamara() {

      if (
        typeof Html5Qrcode ===
        "undefined"
      ) {

        mostrarResultado(
          "❌",
          "Lector QR no disponible",
          "No se pudo cargar html5-qrcode. Abre la aplicación con Internet al menos una vez.",
          "error"
        );


        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Lector no disponible";


        return;

      }


      try {

        scanner =
          new Html5Qrcode(
            "reader"
          );


        await scanner.start(

          {
            facingMode:
              "environment"
          },

          {

            fps: 10,

            qrbox: {

              width: 210,

              height: 210

            },

            aspectRatio: 1.0

          },

          function(decodedText) {

            console.log(
              "QR:",
              decodedText
            );


            procesarQR(
              decodedText
            );

          },

          function(errorMessage) {

            /*
             * Errores normales de búsqueda.
             */

          }

        );


        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Cámara activa";

      }
      catch(error) {

        console.error(
          "Error de cámara:",
          error
        );


        document.getElementById(
          "cameraStatus"
        ).textContent =
          "Error";


        mostrarResultado(
          "📷",
          "No se pudo iniciar la cámara",
          "Revisa el permiso de cámara del navegador.",
          "error"
        );

      }

    }


    /* =====================================================
       EVENTO ONLINE
       ===================================================== */

    window.addEventListener(
      "online",
      async function() {

        actualizarConexion();


        /*
         * Damos un pequeño margen para que
         * la conexión realmente se estabilice.
         */

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              800
            );

          }
        );


        await cargarAlumnos();


        await sincronizarPendientes();


        await actualizarResumenAsistencia();

      }
    );


    /* =====================================================
       EVENTO OFFLINE
       ===================================================== */

    window.addEventListener(
      "offline",
      function() {

        internetReal =
          false;


        actualizarConexion();


        mostrarResultado(
          "📱",
          "Modo sin conexión",
          "Las nuevas asistencias se guardarán automáticamente en este dispositivo.",
          "offline"
        );

      }
    );


    /* =====================================================
       BOTÓN SINCRONIZACIÓN
       ===================================================== */

    document.getElementById(
      "syncButton"
    ).addEventListener(
      "click",
      sincronizarPendientes
    );


    /* =====================================================
       INICIO
       ===================================================== */

    async function iniciarAplicacion() {

      try {

        /*
         * Primero abrimos IndexedDB.
         *
         * Esto es fundamental para poder trabajar
         * aunque no exista Internet.
         */

        await abrirBaseDatos();


        /*
         * Estado inicial.
         */

        internetReal =
          navigator.onLine;


        actualizarConexion();


        /*
         * Cargar alumnos.
         *
         * Online:
         *   Google Sheets → IndexedDB
         *
         * Offline:
         *   IndexedDB
         */

        await cargarAlumnos();


        /*
         * Mostrar pendientes inmediatamente.
         */

        await actualizarPendientes();


        /*
         * Si hay Internet:
         *
         * 1. sincronizar
         * 2. actualizar resumen
         */

        if (navigator.onLine) {

          await sincronizarPendientes();

          await actualizarResumenAsistencia();

        }


        /*
         * La cámara se inicia después de
         * preparar completamente la base local.
         */

        await iniciarCamara();

      }
      catch(error) {

        console.error(
          "Error iniciando aplicación:",
          error
        );


        /*
         * Incluso si algo falla,
         * intentamos mantener la cámara disponible.
         */

        try {

          await iniciarCamara();

        }
        catch(e) {

          console.error(e);

        }

      }

    }


    /* =====================================================
       INICIAR
       ===================================================== */

    window.addEventListener(
      "load",
      iniciarAplicacion
    );

  </script>
