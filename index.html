```html
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de Asistencia</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
    }

    .exito {
      color: green;
    }

    .error {
      color: red;
    }

    .info {
      color: #1976d2;
    }

  </style>

</head>


<body>

  <h1>Control de Asistencia</h1>

  <p>Escanea el código QR del alumno</p>

  <button
    id="btnCamara"
    onclick="iniciarScanner()">

    📷 Iniciar cámara

  </button>

  <div id="reader"></div>

  <div id="resultado">

    Presiona "Iniciar cámara"

  </div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT
// =====================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbz3Yo5EBcimLtmMWWWUs33-kE2uENDS1TWvzecwW2MThoz7YscgNZEhOeHyliy60yE/exec";


// =====================================================
// VARIABLES
// =====================================================

let scanner = null;

let procesando = false;


// =====================================================
// INICIAR SCANNER
// =====================================================

function iniciarScanner() {

  if (scanner !== null || procesando) {
    return;
  }

  const boton =
    document.getElementById("btnCamara");

  const resultado =
    document.getElementById("resultado");


  boton.disabled = true;

  resultado.innerHTML =
    "<div class='info'>" +
    "Solicitando acceso a la cámara..." +
    "</div>";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      procesarQR(decodedText);

    },

    function(errorMessage) {

      // Ignorar errores normales
      // mientras se busca el QR

    }

  )

  .then(function() {

    resultado.innerHTML =
      "<div class='info'>" +
      "Apunta la cámara al código QR" +
      "</div>";

  })

  .catch(function(error) {

    scanner = null;

    boton.disabled = false;

    resultado.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ No se pudo abrir la cámara</h2>" +

      "<p>" +
      error +
      "</p>" +

      "</div>";

  });

}


// =====================================================
// PROCESAR QR
// =====================================================

function procesarQR(codigo) {

  if (procesando) {
    return;
  }

  procesando = true;


  const resultado =
    document.getElementById("resultado");


  resultado.innerHTML =

    "<div class='info'>" +

    "<h2>Procesando...</h2>" +

    "<p>QR detectado</p>" +

    "</div>";


  // ===================================================
  // DETENER CÁMARA
  // ===================================================

  let detenerCamara = Promise.resolve();


  if (scanner) {

    detenerCamara =
      scanner
        .stop()
        .catch(function() {});

  }


  // ===================================================
  // CREAR CALLBACK JSONP
  // ===================================================

  const callbackName =
    "__qrCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      console.log(
        "Respuesta Google Apps Script:",
        data
      );


      mostrarResultado(data);

      limpiarJSONP();

    };


  // ===================================================
  // LIMPIAR JSONP
  // ===================================================

  function limpiarJSONP() {

    const elemento =
      document.getElementById(callbackName);

    if (elemento) {
      elemento.remove();
    }

    try {

      delete window[callbackName];

    }

    catch (e) {

      window[callbackName] =
        undefined;

    }

  }


  // ===================================================
  // CREAR URL
  // =====================================================

  const url =
    URL_APPS_SCRIPT +

    "?idQR=" +
    encodeURIComponent(codigo) +

    "&callback=" +
    encodeURIComponent(callbackName);


  console.log(
    "URL enviada:",
    url
  );


  // ===================================================
  // CREAR SCRIPT JSONP
  // ===================================================

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    url;


  // ===================================================
  // ERROR
  // ===================================================

  script.onerror =
    function() {

      limpiarJSONP();

      resultado.innerHTML =

        "<div class='error'>" +

        "<h2>⚠ Error de conexión</h2>" +

        "<p>" +

        "No fue posible comunicarse " +
        "con Google Apps Script."

        +

        "</p>" +

        "</div>";


      procesando = false;

      scanner = null;

      document
        .getElementById("btnCamara")
        .disabled = false;

    };


  // ===================================================
  // INSERTAR SCRIPT
  // ===================================================

  document.head.appendChild(script);

}


// =====================================================
// MOSTRAR RESULTADO
// =====================================================

function mostrarResultado(resultado) {

  const contenedor =
    document.getElementById("resultado");


  console.log(
    "Resultado recibido:",
    resultado
  );


  // ===================================================
  // ASISTENCIA NUEVA
  // ===================================================

  if (
    resultado &&
    resultado.ok === true
  ) {

    contenedor.innerHTML =

      "<div class='exito'>" +

      "<h2>✓ Asistencia registrada</h2>" +

      "<p>" +

      "<strong>" +
      (resultado.nombre || "") +
      "</strong>" +

      "</p>" +

      "<p>" +

      "Grupo: " +
      (resultado.grupo || "") +

      "</p>" +

      "<p>" +

      "Fecha: " +
      (resultado.fecha || "") +

      "</p>" +

      "<p>" +

      "Hora: " +
      (resultado.hora || "") +

      "</p>" +

      "</div>";

  }


  // ===================================================
  // DUPLICADO
  // ===================================================

  else if (
    resultado &&
    resultado.duplicado === true
  ) {

    contenedor.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ Asistencia ya registrada</h2>" +

      "<p>" +

      "<strong>" +
      (resultado.nombre || "") +
      "</strong>" +

      "</p>" +

      "<p>" +

      "Grupo: " +
      (resultado.grupo || "") +

      "</p>" +

      "<p>" +

      "Hora del registro: " +
      (resultado.hora || "") +

      "</p>" +

      "<p>" +

      (resultado.mensaje ||
      "Este alumno ya registró asistencia hoy") +

      "</p>" +

      "</div>";

  }


  // ===================================================
  // ERROR DEL SISTEMA
  // ===================================================

  else {

    contenedor.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ Error</h2>" +

      "<p>" +

      (
        resultado &&
        resultado.mensaje

          ?

        resultado.mensaje

          :

        "Respuesta no válida del servidor."
      )

      +

      "</p>" +

      "</div>";

  }


  // ===================================================
  // REINICIAR
  // ===================================================

  setTimeout(function() {

    procesando = false;

    scanner = null;

    document
      .getElementById("btnCamara")
      .disabled = false;

    iniciarScanner();

  }, 3000);

}


</script>

</body>

</html>
