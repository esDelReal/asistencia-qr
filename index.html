<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ludwig Van Beethoven</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #1f2937;
    }

    header {
      background: #17365d;
      color: white;
      padding: 18px 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: .9;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 20px auto;
    }

    .estado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .punto {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #22c55e;
    }

    .punto.offline {
      background: #ef4444;
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card .numero {
      font-size: 28px;
      font-weight: bold;
      color: #17365d;
    }

    .card .titulo {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }

    .scanner-card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      text-align: center;
    }

    .scanner-card h2 {
      margin-top: 0;
      color: #17365d;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .mensaje {
      margin: 15px auto;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      max-width: 600px;
      display: none;
    }

    .mensaje.exito {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .mensaje.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .mensaje.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .mensaje.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .resumen {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-top: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .resumen h2 {
      margin-top: 0;
      color: #17365d;
    }

    .resumen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .resumen-item {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
    }

    .resumen-item strong {
      display: block;
      font-size: 25px;
      color: #17365d;
    }

    .resumen-item span {
      font-size: 13px;
      color: #6b7280;
    }

    .porcentaje {
      text-align: center;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .barra {
      width: 100%;
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    #barraProgreso {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width .4s ease;
    }

    .pendientes {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 20px;
      }

      .estadisticas {
        grid-template-columns: repeat(2, 1fr);
      }

      .resumen-grid {
        grid-template-columns: 1fr;
      }

      .scanner-card {
        padding: 10px;
      }

      #reader {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Secundaria N.º 101</h1>
  <p>Ludwig Van Beethoven</p>
</header>

<div class="container">

  <!-- ESTADO DE CONEXIÓN -->
  <div class="estado">
    <div id="puntoEstado" class="punto"></div>
    <span id="textoEstado">Conectando...</span>
  </div>

  <!-- ESTADÍSTICAS SUPERIORES -->
  <div class="estadisticas">

    <div class="card">
      <div id="totalActivos" class="numero">0</div>
      <div class="titulo">Alumnos activos</div>
    </div>

    <div class="card">
      <div id="pendientes" class="numero">0</div>
      <div class="titulo">Pendientes de sincronizar</div>
    </div>

  </div>

  <!-- MENSAJE -->
  <div id="mensaje" class="mensaje"></div>

  <!-- ESCÁNER -->
  <div class="scanner-card">

    <h2>Registro de asistencia</h2>

    <div id="reader"></div>

  </div>

  <!-- RESUMEN -->
  <div class="resumen">

    <h2>Resumen de asistencia</h2>

    <div class="resumen-grid">

      <div class="resumen-item">
        <strong id="resumenActivos">0</strong>
        <span>Alumnos activos</span>
      </div>

      <div class="resumen-item">
        <strong id="hanIngresado">0</strong>
        <span>Han ingresado</span>
      </div>

      <div class="resumen-item">
        <strong id="faltanIngresar">0</strong>
        <span>Faltan</span>
      </div>

    </div>

    <div class="porcentaje">
      Asistencia: <span id="porcentajeAsistencia">0%</span>
    </div>

    <div class="barra">
      <div id="barraProgreso"></div>
    </div>

    <div id="fechaResumen" class="pendientes"></div>

  </div>

</div>

<footer>
  Sistema de asistencia QR
</footer>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


/* =========================================================
   VARIABLES
========================================================= */

let db = null;
let scanner = null;
let procesandoQR = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const mensaje = document.getElementById("mensaje");

const puntoEstado =
  document.getElementById("puntoEstado");

const textoEstado =
  document.getElementById("textoEstado");

const totalActivos =
  document.getElementById("totalActivos");

const pendientes =
  document.getElementById("pendientes");

const resumenActivos =
  document.getElementById("resumenActivos");

const hanIngresado =
  document.getElementById("hanIngresado");

const faltanIngresar =
  document.getElementById("faltanIngresar");

const porcentajeAsistencia =
  document.getElementById("porcentajeAsistencia");

const barraProgreso =
  document.getElementById("barraProgreso");

const fechaResumen =
  document.getElementById("fechaResumen");


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(texto, tipo = "info") {

  mensaje.textContent = texto;

  mensaje.className = "mensaje " + tipo;

}


function ocultarMensaje() {

  mensaje.className = "mensaje";

  mensaje.textContent = "";

}


/* =========================================================
   CONEXIÓN
========================================================= */

function actualizarEstadoConexion() {

  if (navigator.onLine) {

    puntoEstado.classList.remove("offline");

    textoEstado.textContent = "Conectado";

  } else {

    puntoEstado.classList.add("offline");

    textoEstado.textContent = "Sin conexión";

  }

}


/* =========================================================
   INDEXEDDB
========================================================= */

function abrirDB() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open("AsistenciaQR", 1);

    request.onupgradeneeded = function(event) {

      const database = event.target.result;

      if (!database.objectStoreNames.contains("alumnos")) {

        database.createObjectStore(
          "alumnos",
          { keyPath: "idQR" }
        );

      }

      if (!database.objectStoreNames.contains("asistencias")) {

        const store =
          database.createObjectStore(
            "asistencias",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        store.createIndex(
          "estado",
          "estado",
          { unique: false }
        );

      }

    };

    request.onsuccess = function(event) {

      db = event.target.result;

      resolve(db);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   GUARDAR ALUMNOS
   IMPORTANTE:
   REEMPLAZA COMPLETAMENTE LA CACHÉ LOCAL
========================================================= */

function guardarAlumnos(alumnos) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readwrite"
      );

    const store =
      transaction.objectStore("alumnos");


    /*
      MUY IMPORTANTE:

      Primero eliminamos TODOS los alumnos
      guardados anteriormente.

      Así no quedan alumnos antiguos
      que ya no existen en Google Sheets.
    */

    const limpiar = store.clear();


    limpiar.onsuccess = function() {

      for (const alumno of alumnos) {

        store.put({

          idQR: alumno.idQR,

          nombre: alumno.nombre,

          grupo: alumno.grupo,

          activo: alumno.activo

        });

      }

    };


    transaction.oncomplete = function() {

      resolve();

    };


    transaction.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   OBTENER ALUMNOS LOCALES
========================================================= */

function obtenerTodosLosAlumnos() {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );

    const store =
      transaction.objectStore("alumnos");

    const request =
      store.getAll();

    request.onsuccess = function() {

      resolve(request.result || []);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   BUSCAR ALUMNO LOCAL
========================================================= */

function buscarAlumnoLocal(idQR) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }

    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );

    const store =
      transaction.objectStore("alumnos");

    const request =
      store.get(idQR);

    request.onsuccess = function() {

      resolve(request.result || null);

    };

    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   GUARDAR ASISTENCIA OFFLINE
========================================================= */

function registrarOffline(alumno, idQR) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(new Error("Base local no disponible"));

      return;

    }


    const transaction =
      db.transaction(
        "asistencias",
        "readwrite"
      );

    const store =
      transaction.objectStore("asistencias");


    const ahora = new Date();


    const fecha =
      String(ahora.getDate()).padStart(2, "0") +
      "/" +
      String(ahora.getMonth() + 1).padStart(2, "0") +
      "/" +
      ahora.getFullYear();


    const hora =
      String(ahora.getHours()).padStart(2, "0") +
      ":" +
      String(ahora.getMinutes()).padStart(2, "0") +
      ":" +
      String(ahora.getSeconds()).padStart(2, "0");


    const registro = {

      idQR: idQR,

      nombre: alumno.nombre,

      grupo: alumno.grupo,

      fecha: fecha,

      hora: hora,

      estado: "pendiente"

    };


    /*
      Antes de guardar verificamos si ya
      existe una asistencia pendiente
      del mismo alumno.
    */

    const request =
      store.getAll();


    request.onsuccess = function() {

      const registros =
        request.result || [];


      const duplicado =
        registros.some(registro =>

          registro.idQR === idQR &&

          registro.fecha === fecha &&

          (
            registro.estado === "pendiente" ||
            registro.estado === "sincronizado"
          )

        );


      if (duplicado) {

        mostrarMensaje(
          "Este alumno ya tiene un registro de asistencia para hoy.",
          "warning"
        );

        resolve(false);

        return;

      }


      store.add(registro);

    };


    request.onerror = function(event) {

      reject(event.target.error);

    };


    transaction.oncomplete = function() {

      resolve(true);

    };


    transaction.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   CONTAR PENDIENTES
========================================================= */

function actualizarPendientes() {

  return new Promise((resolve, reject) => {

    if (!db) {

      resolve();

      return;

    }

    const transaction =
      db.transaction(
        "asistencias",
        "readonly"
      );

    const store =
      transaction.objectStore("asistencias");

    const request =
      store.getAll();


    request.onsuccess = function() {

      const registros =
        request.result || [];

      const total =
        registros.filter(
          r => r.estado === "pendiente"
        ).length;


      pendientes.textContent = total;

      resolve();

    };


    request.onerror = function(event) {

      reject(event.target.error);

    };

  });

}


/* =========================================================
   CARGAR ALUMNOS DESDE GOOGLE SHEETS
========================================================= */

async function cargarAlumnosDesdeServidor() {

  if (!navigator.onLine) {

    return false;

  }


  try {

    const url =
      API_URL +
      "?action=alumnos&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "No se pudieron obtener los alumnos"
      );

    }


    /*
      Reemplazamos completamente
      la caché local.
    */

    await guardarAlumnos(
      data.alumnos || []
    );


    return true;

  } catch (error) {

    console.error(
      "Error cargando alumnos:",
      error
    );

    return false;

  }

}


/* =========================================================
   RESUMEN DE ASISTENCIA
   FUENTE PRINCIPAL = GOOGLE SHEETS
========================================================= */

async function actualizarResumenAsistencia() {

  if (!navigator.onLine) {

    return;

  }


  try {

    const url =
      API_URL +
      "?action=resumen&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (!data.ok) {

      throw new Error(
        data.error ||
        "No se pudo obtener el resumen"
      );

    }


    /*
      MUY IMPORTANTE:

      Estos valores vienen directamente
      de Google Sheets.

      No usamos IndexedDB para determinar
      cuántos alumnos activos existen.
    */

    const activos =
      Number(data.totalActivos) || 0;

    const ingresados =
      Number(data.hanIngresado) || 0;

    const faltan =
      Number(data.faltan) || 0;

    const porcentaje =
      Number(data.porcentaje) || 0;


    /* ESTADÍSTICA SUPERIOR */

    totalActivos.textContent =
      activos;


    /* RESUMEN */

    resumenActivos.textContent =
      activos;

    hanIngresado.textContent =
      ingresados;

    faltanIngresar.textContent =
      faltan;

    porcentajeAsistencia.textContent =
      porcentaje + "%";


    barraProgreso.style.width =
      Math.min(
        100,
        Math.max(0, porcentaje)
      ) + "%";


    if (data.fecha) {

      fechaResumen.textContent =
        "Fecha: " +
        data.fecha;

    }


  } catch (error) {

    console.error(
      "Error actualizando resumen:",
      error
    );

  }

}


/* =========================================================
   PROCESAR QR
========================================================= */

async function procesarQR(idQR) {

  if (procesandoQR) {

    return;

  }


  procesandoQR = true;


  try {

    idQR =
      String(idQR || "")
        .trim();


    if (!idQR) {

      return;

    }


    /* =====================================================
       MODO OFFLINE
    ===================================================== */

    if (!navigator.onLine) {

      const alumno =
        await buscarAlumnoLocal(idQR);


      if (!alumno) {

        mostrarMensaje(
          "QR no encontrado en la información disponible sin conexión.",
          "error"
        );

        return;

      }


      const activo =
        String(alumno.activo || "")
          .toLowerCase()
          .trim();


      if (
        activo !== "sí" &&
        activo !== "si"
      ) {

        mostrarMensaje(
          "Alumno inactivo.",
          "error"
        );

        return;

      }


      const guardado =
        await registrarOffline(
          alumno,
          idQR
        );


      if (guardado) {

        mostrarMensaje(
          "Asistencia registrada sin conexión. Se sincronizará automáticamente.",
          "warning"
        );

      }


      await actualizarPendientes();

      return;

    }


    /* =====================================================
       MODO ONLINE
    ===================================================== */

    mostrarMensaje(
      "Registrando asistencia...",
      "info"
    );


    const url =
      API_URL +
      "?idQR=" +
      encodeURIComponent(idQR) +
      "&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Error HTTP " + response.status
      );

    }


    const data =
      await response.json();


    /* ALUMNO REGISTRADO */

    if (data.ok) {

      mostrarMensaje(
        "✓ " +
        (data.nombre || "Alumno") +
        " — asistencia registrada correctamente.",
        "exito"
      );


      /*
        Actualizamos el resumen
        inmediatamente.
      */

      await actualizarResumenAsistencia();


      return;

    }


    /* DUPLICADO */

    if (data.duplicado) {

      mostrarMensaje(
        "Este alumno ya registró su asistencia hoy.",
        "warning"
      );


      await actualizarResumenAsistencia();

      return;

    }


    /* INACTIVO */

    if (
      data.inactivo ||
      data.error === "ALUMNO_INACTIVO"
    ) {

      mostrarMensaje(
        "Alumno inactivo. No se puede registrar la asistencia.",
        "error"
      );

      return;

    }


    /* QR NO ENCONTRADO */

    if (
      data.noEncontrado ||
      data.error === "ALUMNO_NO_ENCONTRADO"
    ) {

      mostrarMensaje(
        "QR no encontrado. Verifica que el alumno esté registrado.",
        "error"
      );

      return;

    }


    /* OTRO ERROR */

    mostrarMensaje(
      data.error ||
      "No se pudo registrar la asistencia.",
      "error"
    );


  } catch (error) {

    console.error(
      "Error procesando QR:",
      error
    );


    /*
      Si perdimos la conexión justo durante
      el registro, intentamos trabajar offline.
    */

    if (!navigator.onLine) {

      try {

        const alumno =
          await buscarAlumnoLocal(idQR);


        if (alumno) {

          const activo =
            String(alumno.activo || "")
              .toLowerCase()
              .trim();


          if (
            activo === "sí" ||
            activo === "si"
          ) {

            const guardado =
              await registrarOffline(
                alumno,
                idQR
              );


            if (guardado) {

              mostrarMensaje(
                "Se perdió la conexión. La asistencia quedó guardada para sincronizarse.",
                "warning"
              );

            }

          } else {

            mostrarMensaje(
              "Alumno inactivo.",
              "error"
            );

          }

        } else {

          mostrarMensaje(
            "No hay conexión y el alumno no está disponible en la información local.",
            "error"
          );

        }


      } catch (offlineError) {

        console.error(
          offlineError
        );

        mostrarMensaje(
          "No se pudo registrar la asistencia.",
          "error"
        );

      }


    } else {

      mostrarMensaje(
        "Error de comunicación con el servidor.",
        "error"
      );

    }

  } finally {

    /*
      Pequeño bloqueo para evitar que
      una misma lectura QR se procese
      varias veces inmediatamente.
    */

    setTimeout(() => {

      procesandoQR = false;

    }, 1200);

  }

}


/* =========================================================
   SINCRONIZAR PENDIENTES
========================================================= */

async function sincronizarPendientes() {

  if (!navigator.onLine) {

    return;

  }


  if (!db) {

    return;

  }


  try {

    const transaction =
      db.transaction(
        "asistencias",
        "readwrite"
      );

    const store =
      transaction.objectStore("asistencias");


    const registros =
      await new Promise(
        (resolve, reject) => {

          const request =
            store.getAll();

          request.onsuccess =
            () => resolve(
              request.result || []
            );

          request.onerror =
            () => reject(
              request.error
            );

        }
      );


    const pendientesLocal =
      registros.filter(
        r => r.estado === "pendiente"
      );


    for (
      const registro
      of pendientesLocal
    ) {

      try {

        const params =
          new URLSearchParams({

            action: "registrar",

            idQR: registro.idQR,

            nombre: registro.nombre,

            grupo: registro.grupo,

            fecha: registro.fecha,

            hora: registro.hora

          });


        const response =
          await fetch(
            API_URL +
            "?" +
            params.toString() +
            "&t=" +
            Date.now()
          );


        if (!response.ok) {

          continue;

        }


        const data =
          await response.json();


        /*
          Si se registró correctamente
          o ya estaba registrado,
          eliminamos el pendiente local.
        */

        if (
          data.ok ||
          data.duplicado
        ) {

          store.delete(
            registro.id
          );

        }


        /*
          Si el alumno está inactivo,
          también eliminamos el pendiente.
        */

        else if (
          data.inactivo ||
          data.error === "ALUMNO_INACTIVO"
        ) {

          store.delete(
            registro.id
          );

        }

      } catch (error) {

        console.error(
          "Error sincronizando registro:",
          error
        );

      }

    }


    await actualizarPendientes();

    await actualizarResumenAsistencia();


  } catch (error) {

    console.error(
      "Error en sincronización:",
      error
    );

  }

}


/* =========================================================
   CÁMARA
========================================================= */

async function iniciarCamara() {

  try {

    if (scanner) {

      return;

    }


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 210,
          height: 210
        },

        aspectRatio: 1.0

      },

      decodedText => {

        procesarQR(decodedText);

      },

      errorMessage => {

        /*
          No mostramos errores de lectura
          continuamente porque son normales
          mientras la cámara busca un QR.
        */

      }

    );


  } catch (error) {

    console.error(
      "Error iniciando cámara:",
      error
    );


    mostrarMensaje(
      "No se pudo iniciar la cámara. Verifica que el navegador tenga permiso para usarla.",
      "error"
    );

  }

}


/* =========================================================
   EVENTO ONLINE
========================================================= */

window.addEventListener(
  "online",
  async function() {

    actualizarEstadoConexion();


    mostrarMensaje(
      "Conexión restablecida. Actualizando información...",
      "info"
    );


    /*
      Primero descargamos la lista actual
      de Google Sheets.
    */

    await cargarAlumnosDesdeServidor();


    /*
      Después sincronizamos pendientes.
    */

    await sincronizarPendientes();


    /*
      Finalmente actualizamos el resumen.
    */

    await actualizarResumenAsistencia();


    await actualizarPendientes();


    setTimeout(
      ocultarMensaje,
      2500
    );

  }
);


/* =========================================================
   EVENTO OFFLINE
========================================================= */

window.addEventListener(
  "offline",
  function() {

    actualizarEstadoConexion();


    mostrarMensaje(
      "Sin conexión. Las asistencias se guardarán localmente y se sincronizarán al recuperar Internet.",
      "warning"
    );

  }
);


/* =========================================================
   INICIALIZACIÓN
========================================================= */

async function iniciarAplicacion() {

  try {

    /* Abrir IndexedDB */

    await abrirDB();


    /* Estado de conexión */

    actualizarEstadoConexion();


    /*
      Si tenemos Internet:

      1. Descargar alumnos actuales
      2. Reemplazar caché local
      3. Sincronizar pendientes
      4. Actualizar resumen
    */

    if (navigator.onLine) {

      await cargarAlumnosDesdeServidor();

      await sincronizarPendientes();

      await actualizarResumenAsistencia();

    } else {

      /*
        Sin Internet solamente podemos
        trabajar con la información local.
      */

      await actualizarPendientes();

      mostrarMensaje(
        "Trabajando sin conexión. Los registros se sincronizarán cuando vuelva Internet.",
        "warning"
      );

    }


    /*
      Mostrar pendientes
    */

    await actualizarPendientes();


    /*
      Iniciar cámara
    */

    await iniciarCamara();


  } catch (error) {

    console.error(
      "Error iniciando aplicación:",
      error
    );


    mostrarMensaje(
      "No se pudo iniciar correctamente la aplicación.",
      "error"
    );

  }

}


/* =========================================================
   ARRANCAR
========================================================= */

window.addEventListener(
  "load",
  iniciarAplicacion
);

</script>
