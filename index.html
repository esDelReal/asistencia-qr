<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Control de Asistencia</title>


  <!-- =====================================================
       LIBRERÍA QR
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #0f172a 0%,
          #1e293b 38%,
          #f1f5f9 38%,
          #f1f5f9 100%
        );

      color: #0f172a;

    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .contenedor {

      width: 100%;

      max-width: 520px;

      margin: 0 auto;

      padding: 24px 16px 35px;

    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .encabezado {

      text-align: center;

      color: white;

      padding: 8px 0 24px;

    }


    .logo {

      width: 64px;

      height: 64px;

      margin: 0 auto 12px;

      border-radius: 18px;

      background: rgba(255,255,255,0.15);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 32px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);

    }


    .encabezado h1 {

      margin: 0;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.5px;

    }


    .encabezado p {

      margin: 8px 0 0;

      font-size: 15px;

      opacity: 0.85;

    }


    /* =====================================================
       TARJETA PRINCIPAL
       ===================================================== */

    .tarjeta {

      background: white;

      border-radius: 20px;

      padding: 18px;

      box-shadow:
        0 12px 35px
        rgba(15,23,42,0.18);

    }


    /* =====================================================
       ESTADO
       ===================================================== */

    .estado {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin-bottom: 14px;

      font-size: 14px;

      font-weight: 600;

      color: #64748b;

    }


    .punto {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #94a3b8;

    }


    .punto.activo {

      background: #22c55e;

      box-shadow:
        0 0 0 4px
        rgba(34,197,94,0.15);

    }


    /* =====================================================
       LECTOR QR
       ===================================================== */

    #reader {

      width: 100%;

      max-width: 450px;

      margin: 0 auto;

      overflow: hidden;

      border-radius: 16px;

      background: #0f172a;

    }


    /* Ocultar algunos elementos de texto
       generados por html5-qrcode */

    #reader__dashboard_section_csr button {

      border-radius: 8px !important;

    }


    /* =====================================================
       BOTÓN PRINCIPAL
       ===================================================== */

    .boton {

      width: 100%;

      margin-top: 16px;

      padding: 15px 20px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;

      box-shadow:
        0 5px 15px
        rgba(37,99,235,0.25);

    }


    .boton:active {

      transform: scale(0.98);

    }


    .boton:disabled {

      opacity: 0.55;

      cursor: not-allowed;

      box-shadow: none;

    }


    /* =====================================================
       RESULTADO
       ===================================================== */

    #resultado {

      margin-top: 16px;

      border-radius: 14px;

      padding: 18px;

      background: #f8fafc;

      text-align: center;

      min-height: 70px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #resultado h2 {

      margin:
        0 0 10px;

      font-size: 22px;

    }


    #resultado p {

      margin: 7px 0;

      line-height: 1.45;

    }


    /* =====================================================
       ESTADOS
       ===================================================== */

    .exito {

      width: 100%;

      color: #166534;

    }


    .error {

      width: 100%;

      color: #b91c1c;

    }


    .info {

      width: 100%;

      color: #1d4ed8;

    }


    /* =====================================================
       ICONO DE RESULTADO
       ===================================================== */

    .icono-resultado {

      width: 58px;

      height: 58px;

      margin: 0 auto 12px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      background: #dcfce7;

    }


    .icono-error {

      background: #fee2e2;

    }


    /* =====================================================
       DATOS DEL ALUMNO
       ===================================================== */

    .nombre {

      font-size: 21px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .grupo {

      display: inline-block;

      padding: 5px 12px;

      border-radius: 20px;

      background: #e0e7ff;

      color: #3730a3;

      font-weight: 700;

      font-size: 14px;

    }


    .hora {

      font-size: 15px;

      color: #475569;

      margin-top: 10px;

    }


    /* =====================================================
       PIE
       ===================================================== */

    .pie {

      text-align: center;

      margin-top: 18px;

      color: #64748b;

      font-size: 12px;

    }


    /* =====================================================
       MÓVIL
       ===================================================== */

    @media (max-width: 380px) {

      .encabezado h1 {

        font-size: 24px;

      }

      .tarjeta {

        padding: 14px;

      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <!-- ===================================================
       ENCABEZADO
       =================================================== -->

  <header class="encabezado">

    <div class="logo">
      📋
    </div>

    <h1>
      Control de Asistencia
    </h1>

    <p>
      Escanea el código QR del alumno
    </p>

  </header>



  <!-- ===================================================
       TARJETA
       =================================================== -->

  <main class="tarjeta">


    <!-- ESTADO -->

    <div
      id="estado"
      class="estado">

      <span
        id="punto"
        class="punto">
      </span>

      <span id="textoEstado">
        Cámara inactiva
      </span>

    </div>


    <!-- LECTOR -->

    <div id="reader"></div>


    <!-- BOTÓN -->

    <button
      id="btnCamara"
      class="boton"
      onclick="iniciarScanner()">

      📷 Iniciar cámara

    </button>


    <!-- RESULTADO -->

    <div id="resultado">

      <div class="info">

        <strong>
          Listo para registrar asistencia
        </strong>

        <p>
          Presiona el botón para activar la cámara.
        </p>

      </div>

    </div>


  </main>


  <!-- ===================================================
       PIE
       =================================================== -->

  <div class="pie">

    Sistema de control de asistencia

  </div>


</div>



<script>


// ==========================================================
// CONFIGURACIÓN GOOGLE APPS SCRIPT
// ==========================================================

const URL_GOOGLE =
  "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


// ==========================================================
// VARIABLES
// ==========================================================

let scanner = null;

let procesando = false;

let ultimoQR = "";

let ultimoEscaneo = 0;


// ==========================================================
// ELEMENTOS
// ==========================================================

const boton =
  document.getElementById(
    "btnCamara"
  );


const resultado =
  document.getElementById(
    "resultado"
  );


const punto =
  document.getElementById(
    "punto"
  );


const textoEstado =
  document.getElementById(
    "textoEstado"
  );


// ==========================================================
// ESTADO DE CÁMARA
// ==========================================================

function cambiarEstado(
  activo,
  texto
) {

  textoEstado.textContent =
    texto;

  if (activo) {

    punto.classList.add(
      "activo"
    );

  } else {

    punto.classList.remove(
      "activo"
    );

  }

}


// ==========================================================
// INICIAR SCANNER
// ==========================================================

function iniciarScanner() {


  if (
    scanner !== null ||
    procesando
  ) {

    return;

  }


  boton.disabled = true;


  cambiarEstado(
    false,
    "Activando cámara..."
  );


  resultado.innerHTML =

    "<div class='info'>" +

    "<strong>📷 Activando cámara</strong>" +

    "<p>" +

    "Apunta la cámara al código QR."

    +

    "</p>" +

    "</div>";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode: "environment"
    },


    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    },


    function(decodedText) {

      procesarQR(
        decodedText
      );

    },


    function(errorMessage) {

      // Errores normales
      // durante la búsqueda.

    }

  )


  .then(function() {


    cambiarEstado(
      true,
      "Cámara activa"
    );


    resultado.innerHTML =

      "<div class='info'>" +

      "<strong>✓ Cámara lista</strong>" +

      "<p>" +

      "Apunta al código QR del alumno."

      +

      "</p>" +

      "</div>";

  })


  .catch(function(error) {


    scanner = null;

    boton.disabled = false;


    cambiarEstado(
      false,
      "Cámara inactiva"
    );


    resultado.innerHTML =

      "<div class='error'>" +

      "<div class='icono-resultado icono-error'>" +

      "⚠️" +

      "</div>" +

      "<h2>No se pudo abrir la cámara</h2>" +

      "<p>" +

      escaparHTML(error)

      +

      "</p>" +

      "</div>";

  });

}


// ==========================================================
// PROCESAR QR
// ==========================================================

function procesarQR(
  codigo
) {


  const ahora =
    Date.now();


  // --------------------------------------------------------
  // EVITAR DOBLE LECTURA
  // --------------------------------------------------------

  if (
    codigo === ultimoQR &&
    ahora - ultimoEscaneo < 3000
  ) {

    return;

  }


  ultimoQR =
    codigo;


  ultimoEscaneo =
    ahora;


  if (procesando) {

    return;

  }


  procesando = true;


  cambiarEstado(
    false,
    "Registrando asistencia..."
  );


  resultado.innerHTML =

    "<div class='info'>" +

    "<strong>⏳ Registrando asistencia</strong>" +

    "<p>" +

    "Consultando información del alumno..."

    +

    "</p>" +

    "</div>";


  // --------------------------------------------------------
  // DETENER CÁMARA
  // --------------------------------------------------------

  detenerScanner();


  // --------------------------------------------------------
  // JSONP
  // --------------------------------------------------------

  const callback =
    "callback_" +
    Date.now();


  window[callback] =
    function(respuesta) {

      try {

        mostrarResultado(
          respuesta
        );

      }

      finally {

        try {

          delete window[callback];

        } catch (e) {}

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_GOOGLE +
    "?idQR=" +
    encodeURIComponent(
      codigo
    ) +
    "&callback=" +
    callback;


  script.onerror =
    function() {


      try {

        delete window[callback];

      } catch (e) {}


      resultado.innerHTML =

        "<div class='error'>" +

        "<div class='icono-resultado icono-error'>" +

        "⚠️" +

        "</div>" +

        "<h2>Error de conexión</h2>" +

        "<p>" +

        "No fue posible comunicarse con el servidor."

        +

        "</p>" +

        "</div>";


      reiniciarScanner();

    };


  document
    .body
    .appendChild(
      script
    );

}


// ==========================================================
// MOSTRAR RESULTADO
// ==========================================================

function mostrarResultado(
  respuesta
) {


  // ========================================================
  // ÉXITO
  // ========================================================

  if (
    respuesta &&
    respuesta.ok === true
  ) {


    resultado.innerHTML =

      "<div class='exito'>" +

      "<div class='icono-resultado'>" +

      "✓" +

      "</div>" +

      "<h2>Asistencia registrada</h2>" +

      "<div class='nombre'>" +

      escaparHTML(
        respuesta.nombre
      ) +

      "</div>" +

      "<div>" +

      "<span class='grupo'>" +

      "Grupo: " +

      escaparHTML(
        respuesta.grupo
      ) +

      "</span>" +

      "</div>" +

      "<div class='hora'>" +

      "📅 " +

      escaparHTML(
        respuesta.fecha
      ) +

      " &nbsp; • &nbsp; 🕐 " +

      escaparHTML(
        respuesta.hora
      ) +

      "</div>" +

      "</div>";

  }


  // ========================================================
  // DUPLICADO
  // ========================================================

  else if (
    respuesta &&
    respuesta.duplicado === true
  ) {


    resultado.innerHTML =

      "<div class='error'>" +

      "<div class='icono-resultado icono-error'>" +

      "!" +

      "</div>" +

      "<h2>Asistencia ya registrada</h2>" +

      "<div class='nombre'>" +

      escaparHTML(
        respuesta.nombre
      ) +

      "</div>" +

      "<div>" +

      "<span class='grupo'>" +

      "Grupo: " +

      escaparHTML(
        respuesta.grupo
      ) +

      "</span>" +

      "</div>" +

      "<div class='hora'>" +

      "🕐 Registrada a las " +

      escaparHTML(
        respuesta.hora
      ) +

      "</div>" +

      "<p>" +

      escaparHTML(
        respuesta.mensaje
      ) +

      "</p>" +

      "</div>";

  }


  // ========================================================
  // ERROR
  // ========================================================

  else {


    resultado.innerHTML =

      "<div class='error'>" +

      "<div class='icono-resultado icono-error'>" +

      "⚠️" +

      "</div>" +

      "<h2>No se pudo registrar</h2>" +

      "<p>" +

      escaparHTML(

        respuesta &&
        respuesta.mensaje

          ?

        respuesta.mensaje

          :

        "Respuesta no válida del servidor."

      )

      +

      "</p>" +

      "</div>";

  }


  reiniciarScanner();

}


// ==========================================================
// DETENER SCANNER
// ==========================================================

function detenerScanner() {


  if (!scanner) {

    return;

  }


  try {

    scanner
      .stop()
      .catch(
        function() {}
      );

  }

  catch (e) {}

}


// ==========================================================
// REINICIAR SCANNER
// ==========================================================

function reiniciarScanner() {


  setTimeout(function() {


    procesando = false;

    scanner = null;

    boton.disabled = false;


    cambiarEstado(
      false,
      "Preparado para escanear"
    );


    iniciarScanner();


  }, 3000);

}


// ==========================================================
// SEGURIDAD HTML
// ==========================================================

function escaparHTML(
  valor
) {


  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }


  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>


</body>

</html>
