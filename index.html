  <style>

    body {

<body>


<div class="contenedor">


  <!-- ===================================================
       ENCABEZADO

    </div>

    </p>

  <!-- ===================================================
       CONEXIÓN
       =================================================== -->

    id="conexion"

    📵 Modo offline

  </div>

       TARJETA

    <div

      </span>

    </div>


    <div id="reader"></div>

      id="btnCamara"

      onclick="iniciarScanner()">

    </button>

      <div class="info">

      onclick="sincronizar()">

      ☁️ Sincronizar

    </button>

      class="sincronizacion">

      Última sincronización: nunca

    </div>


  </main>


  <div class="pie">

    Sistema de control de asistencia

  </div>


</div>



<script>


// ==========================================================
// CONFIGURACIÓN
// ==========================================================

const URL_GOOGLE =
  "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


// ==========================================================
// VARIABLES
// ==========================================================

let scanner = null;

let procesando = false;

let ultimoQR = "";

let ultimoEscaneo = 0;


// ==========================================================
// BASE LOCAL
// ==========================================================

const DB_NAME =
  "AsistenciaOfflineDB";

const DB_VERSION = 1;

let db = null;


// ==========================================================
// ELEMENTOS
// ==========================================================

const boton =
  document.getElementById(
    "btnCamara"
  );

const resultado =
  document.getElementById(
    "resultado"
  );

const punto =
  document.getElementById(
    "punto"
  );

const textoEstado =
  document.getElementById(
    "textoEstado"
  );

const contador =
  document.getElementById(
    "contador"
  );

const conexion =
  document.getElementById(
    "conexion"
  );


// ==========================================================
// SERVICE WORKER
// ==========================================================

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(function(error) {

          console.error(
            "Error Service Worker:",
            error
          );

        });

    }
  );

}


// ==========================================================
// INDEXEDDB
// ==========================================================

function abrirDB() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const database =
            event.target.result;


          if (
            !database.objectStoreNames.contains(
              "alumnos"
            )
          ) {

            database.createObjectStore(
              "alumnos",
              {
                keyPath: "idQR"
              }
            );

          }


          if (
            !database.objectStoreNames.contains(
              "asistencias"
            )
          ) {

            const store =
              database.createObjectStore(
                "asistencias",
                {
                  keyPath: "id"
                }
              );


            store.createIndex(
              "idQR",
              "idQR",
              {
                unique: false
              }
            );


            store.createIndex(
              "fecha",
              "fecha",
              {
                unique: false
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          db =
            event.target.result;

          resolve(db);

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// OBTENER ALUMNO LOCAL
// ==========================================================

function obtenerAlumno(
  idQR
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "alumnos",
          "readonly"
        );


      const store =
        transaction.objectStore(
          "alumnos"
        );


      const request =
        store.get(idQR);


      request.onsuccess =
        function() {

          resolve(
            request.result || null
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// GUARDAR ALUMNO
// ==========================================================

function guardarAlumno(
  alumno
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "alumnos",
          "readwrite"
        );


      const store =
        transaction.objectStore(
          "alumnos"
        );


      const request =
        store.put(alumno);


      request.onsuccess =
        function() {

          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// OBTENER FECHA LOCAL
// ==========================================================

function obtenerFecha() {

  return new Intl.DateTimeFormat(
    "es-MX",
    {
      timeZone:
        "America/Mexico_City",

      day: "2-digit",

      month: "2-digit",

      year: "numeric"
    }
  ).format(
    new Date()
  );

}


// ==========================================================
// OBTENER HORA LOCAL
// ==========================================================

function obtenerHora() {

  return new Intl.DateTimeFormat(
    "es-MX",
    {
      timeZone:
        "America/Mexico_City",

      hour: "2-digit",

      minute: "2-digit",

      second: "2-digit",

      hour12: false
    }
  ).format(
    new Date()
  );

}


// ==========================================================
// CREAR ID LOCAL
// ==========================================================

function crearIdAsistencia(
  idQR,
  fecha
) {

  return (
    idQR +
    "_" +
    fecha
  );

}


// ==========================================================
// VERIFICAR ASISTENCIA LOCAL
// ==========================================================

function obtenerAsistencia(
  id
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "asistencias",
          "readonly"
        );


      const store =
        transaction.objectStore(
          "asistencias"
        );


      const request =
        store.get(id);


      request.onsuccess =
        function() {

          resolve(
            request.result || null
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// GUARDAR ASISTENCIA LOCAL
// ==========================================================

function guardarAsistencia(
  asistencia
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "asistencias",
          "readwrite"
        );


      const store =
        transaction.objectStore(
          "asistencias"
        );


      const request =
        store.put(asistencia);


      request.onsuccess =
        function() {

          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// OBTENER PENDIENTES
// ==========================================================

function obtenerPendientes() {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "asistencias",
          "readonly"
        );


      const store =
        transaction.objectStore(
          "asistencias"
        );


      const request =
        store.getAll();


      request.onsuccess =
        function() {

          resolve(
            request.result.filter(
              function(item) {

                return !item.sincronizado;

              }
            )
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// CONTADOR
// ==========================================================

async function actualizarContador() {

  if (!db) {
    return;
  }


  const pendientes =
    await obtenerPendientes();


  contador.textContent =
    "Asistencias pendientes: " +
    pendientes.length;

}


// ==========================================================
// ESTADO INTERNET
// ==========================================================

function actualizarConexion() {

  if (navigator.onLine) {

    conexion.textContent =
      "🌐 Con conexión";

    conexion.className =
      "conexion online";

  } else {

    conexion.textContent =
      "📵 Modo offline";

    conexion.className =
      "conexion offline";

  }

}


window.addEventListener(
  "online",
  function() {

    actualizarConexion();

    sincronizar();

  }
);


window.addEventListener(
  "offline",
  actualizarConexion
);


actualizarConexion();


// ==========================================================
// INICIAR CÁMARA
// ==========================================================

function iniciarScanner() {


  if (
    scanner !== null ||
    procesando
  ) {

    return;

  }


  boton.disabled = true;


  textoEstado.textContent =
    "Activando cámara...";


  resultado.innerHTML =

    "<div class='info'>" +

    "<strong>📷 Activando cámara</strong>" +

    "<p>" +

    "Apunta la cámara al código QR."

    +

    "</p>" +

    "</div>";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      procesarQR(
        decodedText
      );

    },

    function() {

      // Ignorar errores normales.

    }

  )


  .then(function() {

    punto.classList.add(
      "activo"
    );

    textoEstado.textContent =
      "Cámara activa";


    resultado.innerHTML =

      "<div class='info'>" +

      "<strong>✓ Cámara lista</strong>" +

      "<p>" +

      "Apunta al código QR del alumno."

      +

      "</p>" +

      "</div>";

  })


  .catch(function(error) {

    scanner = null;

    boton.disabled = false;


    resultado.innerHTML =

      "<div class='error'>" +

      "<div class='icono icono-error'>⚠️</div>" +

      "<h2>No se pudo abrir la cámara</h2>" +

      "<p>" +

      escaparHTML(error)

      +

      "</p>" +

      "</div>";

  });

}


// ==========================================================
// PROCESAR QR OFFLINE
// ==========================================================

async function procesarQR(
  codigo
) {


  const ahora =
    Date.now();


  if (
    codigo === ultimoQR &&
    ahora - ultimoEscaneo < 3000
  ) {

    return;

  }


  ultimoQR =
    codigo;


  ultimoEscaneo =
    ahora;


  if (procesando) {

    return;

  }


  procesando = true;


  detenerScanner();


  try {

    const alumno =
      await obtenerAlumno(
        codigo
      );


    // ======================================================
    // ALUMNO NO EXISTE LOCALMENTE
    // ======================================================

    if (!alumno) {

      mostrarError(

        "Código no disponible",

        "Este alumno no está descargado en el dispositivo."

      );

      reiniciarScanner();

      return;

    }


    // ======================================================
    // FECHA Y HORA
    // ======================================================

    const fecha =
      obtenerFecha();


    const hora =
      obtenerHora();


    const id =
      crearIdAsistencia(
        alumno.idQR,
        fecha
      );


    // ======================================================
    // DUPLICADO LOCAL
    // ======================================================

    const existente =
      await obtenerAsistencia(
        id
      );


    if (existente) {

      mostrarDuplicado(
        existente
      );

      reiniciarScanner();

      return;

    }


    // ======================================================
    // GUARDAR LOCALMENTE
    // ======================================================

    const asistencia = {

      id: id,

      idQR:
        alumno.idQR,

      nombre:
        alumno.nombre,

      grupo:
        alumno.grupo,

      fecha:
        fecha,

      hora:
        hora,

      sincronizado:
        false

    };


    await guardarAsistencia(
      asistencia
    );


    // ======================================================
    // MOSTRAR ÉXITO
    // ======================================================

    mostrarExito(
      asistencia
    );


    actualizarContador();


  }

  catch (error) {

    mostrarError(
      "Error local",
      error.message
    );

  }


  reiniciarScanner();

}


// ==========================================================
// ÉXITO
// ==========================================================

function mostrarExito(
  asistencia
) {

  resultado.innerHTML =

    "<div class='exito'>" +

    "<div class='icono'>✓</div>" +

    "<h2>Asistencia registrada</h2>" +

    "<div class='nombre'>" +

    escaparHTML(
      asistencia.nombre
    ) +

    "</div>" +

    "<span class='grupo'>" +

    "Grupo: " +

    escaparHTML(
      asistencia.grupo
    ) +

    "</span>" +

    "<div class='hora'>" +

    "📅 " +

    escaparHTML(
      asistencia.fecha
    ) +

    " &nbsp; • &nbsp; 🕐 " +

    escaparHTML(
      asistencia.hora
    ) +

    "</div>" +

    "<p>" +

    "✓ Guardada en el dispositivo"

    +

    "</p>" +

    "</div>";

}


// ==========================================================
// DUPLICADO
// ==========================================================

function mostrarDuplicado(
  asistencia
) {

  resultado.innerHTML =

    "<div class='error'>" +

    "<div class='icono icono-error'>!</div>" +

    "<h2>Asistencia ya registrada</h2>" +

    "<div class='nombre'>" +

    escaparHTML(
      asistencia.nombre
    ) +

    "</div>" +

    "<span class='grupo'>" +

    "Grupo: " +

    escaparHTML(
      asistencia.grupo
    ) +

    "</span>" +

    "<div class='hora'>" +

    "🕐 Registrada a las " +

    escaparHTML(
      asistencia.hora
    ) +

    "</div>" +

    "</div>";

}


// ==========================================================
// ERROR
// ==========================================================

function mostrarError(
  titulo,
  mensaje
) {

  resultado.innerHTML =

    "<div class='error'>" +

    "<div class='icono icono-error'>⚠️</div>" +

    "<h2>" +

    escaparHTML(titulo) +

    "</h2>" +

    "<p>" +

    escaparHTML(mensaje) +

    "</p>" +

    "</div>";

}


// ==========================================================
// DETENER SCANNER
// ==========================================================

function detenerScanner() {

  if (!scanner) {
    return;
  }


  try {

    scanner
      .stop()
      .catch(
        function() {}
      );

  }

  catch (e) {}

}


// ==========================================================
// REINICIAR
// ==========================================================

function reiniciarScanner() {

  setTimeout(
    function() {

      procesando = false;

      scanner = null;

      boton.disabled = false;

      punto.classList.remove(
        "activo"
      );

      textoEstado.textContent =
        "Preparado para escanear";


      iniciarScanner();

    },
    2500
  );

}


// ==========================================================
// SINCRONIZAR
// ==========================================================

async function sincronizar() {


  if (!navigator.onLine) {

    mostrarError(
      "Sin conexión",
      "Las asistencias permanecen guardadas en este dispositivo."
    );

    return;

  }


  const pendientes =
    await obtenerPendientes();


  if (
    pendientes.length === 0
  ) {

    alert(
      "No hay asistencias pendientes."
    );

    return;

  }


  resultado.innerHTML =

    "<div class='info'>" +

    "<strong>☁️ Sincronizando...</strong>" +

    "<p>" +

    "Enviando " +

    pendientes.length +

    " asistencia(s)."

    +

    "</p>" +

    "</div>";


  let enviadas = 0;


  for (
    const asistencia
    of pendientes
  ) {

    try {

      const respuesta =
        await enviarAsistencia(
          asistencia
        );


      if (
        respuesta &&
        (
          respuesta.ok === true ||
          respuesta.duplicado === true
        )
      ) {

        await marcarSincronizada(
          asistencia.id
        );

        enviadas++;

      }

    }

    catch (error) {

      console.error(
        "Error sincronizando:",
        error
      );

    }

  }


  await actualizarContador();


  document.getElementById(
    "sincronizacion"
  ).textContent =

    "Última sincronización: " +

    new Date().toLocaleTimeString(
      "es-MX"
    );


  resultado.innerHTML =

    "<div class='exito'>" +

    "<div class='icono'>✓</div>" +

    "<h2>Sincronización completa</h2>" +

    "<p>" +

    enviadas +

    " asistencia(s) enviada(s) a Google."

    +

    "</p>" +

    "</div>";


  setTimeout(
    iniciarScanner,
    2500
  );

}


// ==========================================================
// ENVIAR UNA ASISTENCIA
// ==========================================================

function enviarAsistencia(
  asistencia
) {

  return new Promise(
    function(resolve, reject) {

      const callback =
        "sync_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      window[callback] =
        function(respuesta) {

          try {

            resolve(
              respuesta
            );

          }

          finally {

            delete window[
              callback
            ];

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        URL_GOOGLE +

        "?action=registrar" +

        "&idQR=" +
        encodeURIComponent(
          asistencia.idQR
        ) +

        "&nombre=" +
        encodeURIComponent(
          asistencia.nombre
        ) +

        "&grupo=" +
        encodeURIComponent(
          asistencia.grupo
        ) +

        "&fecha=" +
        encodeURIComponent(
          asistencia.fecha
        ) +

        "&hora=" +
        encodeURIComponent(
          asistencia.hora
        ) +

        "&callback=" +
        callback;


      script.onerror =
        function() {

          delete window[
            callback
          ];

          reject(
            new Error(
              "No se pudo conectar con Google."
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


// ==========================================================
// MARCAR COMO SINCRONIZADA
// ==========================================================

function marcarSincronizada(
  id
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          "asistencias",
          "readwrite"
        );


      const store =
        transaction.objectStore(
          "asistencias"
        );


      const request =
        store.get(id);


      request.onsuccess =
        function() {

          const registro =
            request.result;


          if (!registro) {

            resolve();

            return;

          }


          registro.sincronizado =
            true;


          store.put(
            registro
          );


          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


// ==========================================================
// CARGAR ALUMNOS DESDE GOOGLE
// ==========================================================

function descargarAlumnos() {

  return new Promise(
    function(resolve, reject) {

      if (!navigator.onLine) {

        reject(
          new Error(
            "No hay conexión a Internet."
          )
        );

        return;

      }


      const callback =
        "alumnos_" +
        Date.now();


      window[callback] =
        async function(respuesta) {

          try {

            if (
              !respuesta ||
              !respuesta.ok
            ) {

              reject(
                new Error(
                  respuesta &&
                  respuesta.mensaje
                    ?

                  respuesta.mensaje

                    :

                  "No fue posible descargar alumnos."
                )
              );

              return;

            }


            for (
              const alumno
              of respuesta.alumnos
            ) {

              await guardarAlumno(
                alumno
              );

            }


            resolve(
              respuesta.alumnos.length
            );

          }

          catch (error) {

            reject(
              error
            );

          }

          finally {

            delete window[
              callback
            ];

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        URL_GOOGLE +

        "?action=alumnos" +

        "&callback=" +
        callback;


      script.onerror =
        function() {

          delete window[
            callback
          ];

          reject(
            new Error(
              "No se pudo descargar la lista de alumnos."
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


// ==========================================================
// ESCAPAR HTML
// ==========================================================

function escaparHTML(
  valor
) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }


  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
