<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Control de Asistencia</title>

  <!-- Lector QR -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          145deg,
          #0f172a 0%,
          #172554 50%,
          #0f766e 100%
        );

      color: #0f172a;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    /* =========================
       ENCABEZADO
       ========================= */

    .header {
      color: white;
      margin-bottom: 14px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    /* =========================
       ESTADO DE CONEXIÓN
       ========================= */

    .connection {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 7px 10px;

      border-radius: 20px;

      background: rgba(255,255,255,0.12);

      border: 1px solid rgba(255,255,255,0.15);

      color: white;

      font-size: 11px;

      white-space: nowrap;
    }

    .connection-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #22c55e;
    }

    .connection.offline .connection-dot {
      background: #f59e0b;
    }

    /* =========================
       TARJETA
       ========================= */

    .card {
      background: rgba(255,255,255,0.98);

      border-radius: 20px;

      padding: 16px;

      box-shadow:
        0 18px 40px rgba(0,0,0,0.25);
    }

    /* =========================
       ESTADÍSTICAS
       ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

      margin-bottom: 14px;
    }

    .stat {
      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 13px;

      padding: 10px 12px;
    }

    .stat-label {
      font-size: 10px;

      color: #64748b;

      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 19px;

      font-weight: 750;

      color: #0f172a;
    }

    /* =========================
       CABECERA CÁMARA
       ========================= */

    .camera-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 8px;
    }

    .camera-title {
      font-size: 14px;

      font-weight: 700;

      color: #1e293b;
    }

    .camera-status {
      font-size: 11px;

      color: #64748b;
    }

    /* =========================
       CÁMARA
       ========================= */

    .camera-wrapper {
      width: 100%;

      max-width: 320px;

      margin: 0 auto;

      padding: 4px;

      background: #020617;

      border-radius: 18px;

      box-shadow:
        0 8px 22px rgba(15,23,42,0.20);

      overflow: hidden;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;

      border-radius: 14px !important;

      object-fit: cover !important;
    }

    #reader__scan_region {
      background: #020617 !important;
    }

    #reader__dashboard {
      background: #020617 !important;

      padding: 5px !important;
    }

    #reader__dashboard_section_swaplink {
      color: white !important;
    }

    /* =========================
       RESULTADO
       ========================= */

    .result {
      margin-top: 13px;

      padding: 12px;

      min-height: 68px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      border-radius: 14px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;
    }

    .result-icon {
      font-size: 22px;

      margin-bottom: 2px;
    }

    .result-title {
      font-size: 14px;

      font-weight: 750;

      color: #334155;
    }

    .result-detail {
      margin-top: 3px;

      font-size: 12px;

      color: #64748b;

      white-space: pre-line;
    }

    .result.success {
      background: #ecfdf5;

      border-color: #a7f3d0;
    }

    .result.success .result-title {
      color: #047857;
    }

    .result.error {
      background: #fef2f2;

      border-color: #fecaca;
    }

    .result.error .result-title {
      color: #b91c1c;
    }

    .result.offline {
      background: #fffbeb;

      border-color: #fde68a;
    }

    .result.offline .result-title {
      color: #92400e;
    }

    /* =========================
       BOTÓN
       ========================= */

    .sync-button {
      width: 100%;

      margin-top: 10px;

      padding: 10px;

      border: 0;

      border-radius: 11px;

      background: #0f172a;

      color: white;

      font-size: 12px;

      font-weight: 650;

      cursor: pointer;
    }

    .sync-button:disabled {
      opacity: 0.45;

      cursor: default;
    }

    /* =========================
       PIE
       ========================= */

    .footer {
      text-align: center;

      margin-top: 11px;

      color: #94a3b8;

      font-size: 10px;
    }

    @media (max-width: 380px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 13px;
      }

      .title {
        font-size: 21px;
      }

      .camera-wrapper {
        max-width: 290px;
      }

    }

  </style>
</head>


<body>

  <main class="app">

    <!-- ENCABEZADO -->

    <header class="header">

      <div class="header-row">

        <div>

          <h1 class="title">
            Control de Asistencia
          </h1>

          <p class="subtitle">
            Escanea el código QR del alumno
          </p>

        </div>

        <div
          id="connectionStatus"
          class="connection"
        >

          <span class="connection-dot"></span>

          <span id="connectionText">
            Conectado
          </span>

        </div>

      </div>

    </header>


    <!-- TARJETA PRINCIPAL -->

    <section class="card">


      <!-- ESTADÍSTICAS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            Alumnos disponibles
          </div>

          <div
            id="totalAlumnos"
            class="stat-value"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Pendientes
          </div>

          <div
            id="pendientes"
            class="stat-value"
          >
            0
          </div>

        </div>

      </div>


      <!-- CÁMARA -->

      <div class="camera-header">

        <span class="camera-title">
          Escáner QR
        </span>

        <span
          id="cameraStatus"
          class="camera-status"
        >
          Iniciando...
        </span>

      </div>


      <div class="camera-wrapper">

        <div id="reader"></div>

      </div>


      <!-- RESULTADO -->

      <div
        id="resultado"
        class="result"
      >

        <div>

          <div class="result-icon">
            📷
          </div>

          <div class="result-title">
            Esperando código QR
          </div>

          <div class="result-detail">
            Coloca el código dentro del recuadro
          </div>

        </div>

      </div>


      <!-- SINCRONIZACIÓN -->

      <button
        id="syncButton"
        class="sync-button"
        type="button"
        disabled
      >
        Sincronizar pendientes
      </button>

    </section>


    <footer class="footer">
      Sistema de asistencia QR
    </footer>

  </main>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyczkWRDi9dsKxoKrGQYkLeK9SM7Uts0LKsXnRPL8qGGNnaT4Tb_69inXr3F8Gzf7Pd/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let procesando = false;


/* =====================================================
   BASE DE DATOS LOCAL
   ===================================================== */

const DB_NAME = "AsistenciaQR";

const DB_VERSION = 1;

let db = null;


function abrirBaseDatos() {

  return new Promise(function(resolve, reject) {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const database =
          event.target.result;


        if (
          !database.objectStoreNames.contains(
            "alumnos"
          )
        ) {

          database.createObjectStore(
            "alumnos",
            {
              keyPath: "idQR"
            }
          );

        }


        if (
          !database.objectStoreNames.contains(
            "asistencias"
          )
        ) {

          const store =
            database.createObjectStore(
              "asistencias",
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          store.createIndex(
            "estado",
            "estado",
            {
              unique: false
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        db =
          event.target.result;

        resolve(db);

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


/* =====================================================
   GUARDAR ALUMNOS
   ===================================================== */

function guardarAlumnos(alumnos) {

  return new Promise(function(resolve, reject) {

    if (!db) {

      resolve();

      return;

    }


    const transaction =
      db.transaction(
        "alumnos",
        "readwrite"
      );


    const store =
      transaction.objectStore(
        "alumnos"
      );


    alumnos.forEach(function(alumno) {

      store.put({

        idQR: alumno.idQR,

        nombre: alumno.nombre,

        grupo: alumno.grupo

      });

    });


    transaction.oncomplete =
      function() {

        resolve();

      };


    transaction.onerror =
      function() {

        reject(
          transaction.error
        );

      };

  });

}


/* =====================================================
   OBTENER ALUMNO LOCAL
   ===================================================== */

function obtenerAlumnoLocal(idQR) {

  return new Promise(function(resolve, reject) {

    if (!db) {

      resolve(null);

      return;

    }


    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );


    const store =
      transaction.objectStore(
        "alumnos"
      );


    const request =
      store.get(idQR);


    request.onsuccess =
      function() {

        resolve(
          request.result || null
        );

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


/* =====================================================
   CONTAR ALUMNOS
   ===================================================== */

function actualizarTotalAlumnos() {

  return new Promise(function(resolve) {

    if (!db) {

      resolve();

      return;

    }


    const transaction =
      db.transaction(
        "alumnos",
        "readonly"
      );


    const store =
      transaction.objectStore(
        "alumnos"
      );


    const request =
      store.count();


    request.onsuccess =
      function() {

        document.getElementById(
          "totalAlumnos"
        ).textContent =
          request.result;

        resolve();

      };

  });

}


/* =====================================================
   GUARDAR ASISTENCIA LOCAL
   ===================================================== */

function guardarAsistenciaLocal(asistencia) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        "asistencias",
        "readwrite"
      );


    const store =
      transaction.objectStore(
        "asistencias"
      );


    store.add(asistencia);


    transaction.oncomplete =
      function() {

        resolve();

      };


    transaction.onerror =
      function() {

        reject(
          transaction.error
        );

      };

  });

}


/* =====================================================
   OBTENER PENDIENTES
   ===================================================== */

function obtenerPendientes() {

  return new Promise(function(resolve, reject) {

    if (!db) {

      resolve([]);

      return;

    }


    const transaction =
      db.transaction(
        "asistencias",
        "readonly"
      );


    const store =
      transaction.objectStore(
        "asistencias"
      );


    const request =
      store.getAll();


    request.onsuccess =
      function() {

        const todos =
          request.result || [];


        const pendientes =
          todos.filter(
            function(item) {

              return item.estado === "pendiente";

            }
          );


        resolve(pendientes);

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


/* =====================================================
   ACTUALIZAR CONTADOR
   ===================================================== */

async function actualizarPendientes() {

  const pendientes =
    await obtenerPendientes();


  document.getElementById(
    "pendientes"
  ).textContent =
    pendientes.length;


  document.getElementById(
    "syncButton"
  ).disabled =
    pendientes.length === 0;

}


/* =====================================================
   MOSTRAR RESULTADO
   ===================================================== */

function mostrarResultado(
  icono,
  titulo,
  detalle,
  clase
) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className =
    "result " + clase;


  resultado.innerHTML =

    '<div>' +

      '<div class="result-icon">' +
        icono +
      '</div>' +

      '<div class="result-title">' +
        titulo +
      '</div>' +

      '<div class="result-detail">' +
        detalle +
      '</div>' +

    '</div>';

}


/* =====================================================
   CONEXIÓN
   ===================================================== */

function actualizarConexion() {

  const status =
    document.getElementById(
      "connectionStatus"
    );


  const texto =
    document.getElementById(
      "connectionText"
    );


  if (navigator.onLine) {

    status.classList.remove(
      "offline"
    );


    texto.textContent =
      "Conectado";

  } else {

    status.classList.add(
      "offline"
    );


    texto.textContent =
      "Sin conexión";

  }

}


/* =====================================================
   CARGAR ALUMNOS DESDE GOOGLE
   ===================================================== */

async function cargarAlumnos() {

  if (!navigator.onLine) {

    await actualizarTotalAlumnos();

    return;

  }


  try {

    const url =
      API_URL +
      "?action=alumnos&t=" +
      Date.now();


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      data.ok &&
      Array.isArray(
        data.alumnos
      )
    ) {

      await guardarAlumnos(
        data.alumnos
      );


      await actualizarTotalAlumnos();

    }

  }
  catch(error) {

    console.log(
      "No se pudieron actualizar alumnos:",
      error
    );


    await actualizarTotalAlumnos();

  }

}


/* =====================================================
   FECHA LOCAL
   ===================================================== */

function obtenerFecha() {

  const ahora =
    new Date();


  const dia =
    String(
      ahora.getDate()
    ).padStart(
      2,
      "0"
    );


  const mes =
    String(
      ahora.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const año =
    ahora.getFullYear();


  return (
    dia +
    "/" +
    mes +
    "/" +
    año
  );

}


/* =====================================================
   HORA LOCAL
   ===================================================== */

function obtenerHora() {

  const ahora =
    new Date();


  return ahora.toLocaleTimeString(
    "es-MX"
  );

}


/* =====================================================
   DUPLICADO LOCAL
   ===================================================== */

function verificarDuplicadoLocal(
  idQR,
  fecha
) {

  return new Promise(function(resolve, reject) {

    if (!db) {

      resolve(false);

      return;

    }


    const transaction =
      db.transaction(
        "asistencias",
        "readonly"
      );


    const store =
      transaction.objectStore(
        "asistencias"
      );


    const request =
      store.getAll();


    request.onsuccess =
      function() {

        const duplicado =
          request.result.some(
            function(item) {

              return (
                item.idQR === idQR &&
                item.fecha === fecha
              );

            }
          );


        resolve(
          duplicado
        );

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


/* =====================================================
   REGISTRAR OFFLINE
   ===================================================== */

async function registrarOffline(
  idQR
) {

  const alumno =
    await obtenerAlumnoLocal(
      idQR
    );


  if (!alumno) {

    mostrarResultado(
      "❌",
      "Código no registrado",
      "Este alumno todavía no está almacenado en el dispositivo.",
      "error"
    );

    return;

  }


  const fecha =
    obtenerFecha();


  const hora =
    obtenerHora();


  const duplicado =
    await verificarDuplicadoLocal(
      idQR,
      fecha
    );


  if (duplicado) {

    mostrarResultado(
      "⚠️",
      "Asistencia duplicada",
      alumno.nombre +
      " · " +
      alumno.grupo +
      "\nYa fue registrado hoy.",
      "error"
    );

    return;

  }


  await guardarAsistenciaLocal({

    idQR: idQR,

    nombre: alumno.nombre,

    grupo: alumno.grupo,

    fecha: fecha,

    hora: hora,

    estado: "pendiente"

  });


  await actualizarPendientes();


  mostrarResultado(
    "📱",
    "Asistencia guardada",
    alumno.nombre +
    " · " +
    alumno.grupo +
    "\nGuardada en el dispositivo. Se sincronizará al recuperar Internet.",
    "offline"
  );

}


/* =====================================================
   PROCESAR QR
   ===================================================== */

async function procesarQR(
  idQR
) {

  if (procesando) {

    return;

  }


  procesando = true;


  try {

    /* -------------------------
       OFFLINE
       ------------------------- */

    if (!navigator.onLine) {

      await registrarOffline(
        idQR
      );

      return;

    }


    /* -------------------------
       ONLINE
       ------------------------- */

    mostrarResultado(
      "⏳",
      "Procesando...",
      "Consultando servidor",
      ""
    );


    const url =
      API_URL +
      "?idQR=" +
      encodeURIComponent(
        idQR
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(url);


    const data =
      await response.json();


    console.log(
      "Respuesta:",
      data
    );


    if (data.ok) {

      mostrarResultado(
        "✓",
        "Asistencia registrada",
        data.nombre +
        " · " +
        data.grupo +
        "\n" +
        data.hora,
        "success"
      );

    }
    else {

      if (data.duplicado) {

        mostrarResultado(
          "⚠️",
          "Asistencia duplicada",
          data.mensaje,
          "error"
        );

      }
      else {

        mostrarResultado(
          "❌",
          "Código no registrado",
          data.mensaje,
          "error"
        );

      }

    }

  }
  catch(error) {

    console.error(
      "Error:",
      error
    );


    /*
      Si perdimos Internet durante
      la consulta, intentamos utilizar
      la información local.
    */

    if (!navigator.onLine) {

      await registrarOffline(
        idQR
      );

    }
    else {

      mostrarResultado(
        "❌",
        "Error de conexión",
        "No fue posible comunicarse con el servidor.",
        "error"
      );

    }

  }
  finally {

    setTimeout(
      function() {

        procesando = false;

      },
      1500
    );

  }

}


/* =====================================================
   SINCRONIZAR
   ===================================================== */

async function sincronizarPendientes() {

  if (!navigator.onLine) {

    mostrarResultado(
      "📱",
      "Sin conexión",
      "Las asistencias permanecen guardadas en el dispositivo.",
      "offline"
    );

    return;

  }


  const pendientes =
    await obtenerPendientes();


  if (
    pendientes.length === 0
  ) {

    await actualizarPendientes();

    return;

  }


  const boton =
    document.getElementById(
      "syncButton"
    );


  boton.disabled = true;

  boton.textContent =
    "Sincronizando...";


  for (
    const asistencia of pendientes
  ) {

    try {

      const url =
        API_URL +
        "?action=registrar" +
        "&idQR=" +
        encodeURIComponent(
          asistencia.idQR
        ) +
        "&nombre=" +
        encodeURIComponent(
          asistencia.nombre
        ) +
        "&grupo=" +
        encodeURIComponent(
          asistencia.grupo
        ) +
        "&fecha=" +
        encodeURIComponent(
          asistencia.fecha
        ) +
        "&hora=" +
        encodeURIComponent(
          asistencia.hora
        ) +
        "&t=" +
        Date.now();


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (
        data.ok ||
        data.duplicado
      ) {

        await eliminarAsistencia(
          asistencia.id
        );

      }

    }
    catch(error) {

      console.log(
        "No se pudo sincronizar:",
        asistencia
      );

      break;

    }

  }


  await actualizarPendientes();


  boton.textContent =
    "Sincronizar pendientes";

}


/* =====================================================
   ELIMINAR ASISTENCIA LOCAL
   ===================================================== */

function eliminarAsistencia(
  id
) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        "asistencias",
        "readwrite"
      );


    const store =
      transaction.objectStore(
        "asistencias"
      );


    store.delete(id);


    transaction.oncomplete =
      function() {

        resolve();

      };


    transaction.onerror =
      function() {

        reject(
          transaction.error
        );

      };

  });

}


/* =====================================================
   INICIAR CÁMARA
   ===================================================== */

async function iniciarCamara() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    mostrarResultado(
      "❌",
      "Lector QR no disponible",
      "No se pudo cargar html5-qrcode.",
      "error"
    );

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 210,
          height: 210
        },

        aspectRatio: 1.0
      },

      function(decodedText) {

        console.log(
          "QR:",
          decodedText
        );


        procesarQR(
          decodedText
        );

      },

      function(errorMessage) {

        /*
          Los errores normales durante
          la búsqueda de un QR se ignoran.
        */

      }

    );


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Cámara activa";

  }
  catch(error) {

    console.error(
      "Error de cámara:",
      error
    );


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Error";


    mostrarResultado(
      "📷",
      "No se pudo iniciar la cámara",
      "Revisa el permiso de cámara del navegador.",
      "error"
    );

  }

}


/* =====================================================
   EVENTOS ONLINE / OFFLINE
   ===================================================== */

window.addEventListener(
  "online",
  async function() {

    actualizarConexion();

    await cargarAlumnos();

    await sincronizarPendientes();

  }
);


window.addEventListener(
  "offline",
  function() {

    actualizarConexion();


    mostrarResultado(
      "📱",
      "Modo sin conexión",
      "Las nuevas asistencias se guardarán en este dispositivo.",
      "offline"
    );

  }
);


/* =====================================================
   BOTÓN
   ===================================================== */

document.getElementById(
  "syncButton"
).addEventListener(
  "click",
  sincronizarPendientes
);


/* =====================================================
   INICIO
   ===================================================== */

async function iniciarAplicacion() {

  try {

    await abrirBaseDatos();


    actualizarConexion();


    await cargarAlumnos();


    await actualizarPendientes();


    if (navigator.onLine) {

      await sincronizarPendientes();

    }


    await iniciarCamara();

  }
  catch(error) {

    console.error(
      "Error iniciando aplicación:",
      error
    );

  }

}


window.addEventListener(
  "load",
  iniciarAplicacion
);

</script>
