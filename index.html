<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de Asistencia</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
    }

    .exito {
      color: green;
    }

    .error {
      color: red;
    }

  </style>

</head>


<body>

  <h1>Control de Asistencia</h1>

  <p>Escanea el código QR del alumno</p>

  <button
    id="btnCamara"
    onclick="iniciarScanner()">

    📷 Iniciar cámara

  </button>


  <div id="reader"></div>


  <div id="resultado">

    Presiona "Iniciar cámara"

  </div>


<script>

  // =====================================
  // CONFIGURACIÓN
  // =====================================

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbyNu1yTJOes5zUMtmyLDPm2YpB7cDS7SK-MnGN8DySJB0-1KwFN94O1Vj9N3EosqRM/exec";


  let scanner = null;

  let procesando = false;


  // =====================================
  // INICIAR CÁMARA
  // =====================================

  function iniciarScanner() {

    if (scanner !== null) {
      return;
    }

    document
      .getElementById("btnCamara")
      .disabled = true;


    document
      .getElementById("resultado")
      .innerHTML =
      "Solicitando acceso a la cámara...";


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        procesarQR(decodedText);

      },

      function(errorMessage) {

        // Ignorar errores mientras busca QR

      }

    )

    .then(function() {

      document
        .getElementById("resultado")
        .innerHTML =
        "Apunta la cámara al código QR";

    })

    .catch(function(error) {

      scanner = null;

      document
        .getElementById("btnCamara")
        .disabled = false;

      document
        .getElementById("resultado")
        .innerHTML =
        "<div class='error'>" +
        "<h2>⚠ No se pudo abrir la cámara</h2>" +
        "<p>" +
        error +
        "</p>" +
        "</div>";

    });

  }


  // =====================================
  // PROCESAR QR
  // =====================================

  function procesarQR(codigo) {

    if (procesando) {
      return;
    }

    procesando = true;


    document
      .getElementById("resultado")
      .innerHTML =
      "<h2>Procesando...</h2>" +
      "<p>QR: <strong>" +
      codigo +
      "</strong></p>";


    // Detener cámara mientras procesamos

    if (scanner) {

      scanner
        .stop()
        .catch(function() {});

    }


    // ===================================
    // ENVIAR A APPS SCRIPT
    // ===================================

    const url =
      URL_APPS_SCRIPT +
      "?idQR=" +
      encodeURIComponent(codigo);


    fetch(url, {

      method: "GET",

      cache: "no-store"

    })

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }

      return response.json();

    })

    .then(function(resultado) {

      mostrarResultado(resultado);

    })

    .catch(function(error) {

      document
        .getElementById("resultado")
        .innerHTML =
        "<div class='error'>" +
        "<h2>⚠ Error de conexión</h2>" +
        "<p>" +
        error +
        "</p>" +
        "</div>";

    })

    .finally(function() {

      procesando = false;

      scanner = null;

      document
        .getElementById("btnCamara")
        .disabled = false;

    });

  }


  // =====================================
  // MOSTRAR RESULTADO
  // =====================================

  function mostrarResultado(resultado) {


    if (resultado.ok) {

      document
        .getElementById("resultado")
        .innerHTML =

        "<div class='exito'>" +

        "<h2>✓ Asistencia registrada</h2>" +

        "<p>" +
        "<strong>" +
        resultado.nombre +
        "</strong>" +
        "</p>" +

        "<p>Grupo: " +
        resultado.grupo +
        "</p>" +

        "<p>Fecha: " +
        resultado.fecha +
        "</p>" +

        "<p>Hora: " +
        resultado.hora +
        "</p>" +

        "</div>";

    }


    else if (resultado.duplicado) {

      document
        .getElementById("resultado")
        .innerHTML =

        "<div class='error'>" +

        "<h2>⚠ Ya registrada</h2>" +

        "<p>" +
        "<strong>" +
        resultado.nombre +
        "</strong>" +
        "</p>" +

        "<p>Grupo: " +
        resultado.grupo +
        "</p>" +

        "<p>Hora registrada: " +
        resultado.hora +
        "</p>" +

        "</div>";

    }


    else {

      document
        .getElementById("resultado")
        .innerHTML =

        "<div class='error'>" +

        "<h2>⚠ " +
        resultado.mensaje +
        "</h2>" +

        "</div>";

    }


    // Reiniciar cámara automáticamente

    setTimeout(function() {

      iniciarScanner();

    }, 2500);

  }

</script>

</body>

</html>
