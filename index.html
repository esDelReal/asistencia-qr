<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Asistencia</title>


  <!-- =====================================================
       HTML5 QR CODE
       ===================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      margin: 0;

      padding: 20px;

      background: #f5f5f5;

      text-align: center;

    }


    h1 {

      margin-top: 10px;

      margin-bottom: 8px;

      font-size: 26px;

    }


    .subtitulo {

      margin-top: 0;

      color: #555;

      font-size: 16px;

    }


    #reader {

      width: 100%;

      max-width: 450px;

      margin: 20px auto;

      background: white;

      border-radius: 12px;

      overflow: hidden;

    }


    button {

      padding: 14px 25px;

      font-size: 17px;

      border: none;

      border-radius: 8px;

      background: #1976d2;

      color: white;

      cursor: pointer;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #resultado {

      width: 100%;

      max-width: 450px;

      margin: 20px auto;

      padding: 20px;

      background: white;

      border-radius: 10px;

      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);

      font-size: 17px;

    }


    .exito {

      color: #16803c;

    }


    .error {

      color: #c62828;

    }


    .info {

      color: #1976d2;

    }


    h2 {

      margin-top: 0;

    }


    .dato {

      margin: 8px 0;

    }

  </style>

</head>


<body>


  <h1>
    Control de Asistencia
  </h1>


  <p class="subtitulo">
    Escanea el código QR del alumno
  </p>


  <button
    id="btnCamara"
    onclick="iniciarScanner()">

    📷 Iniciar cámara

  </button>


  <div id="reader"></div>


  <div id="resultado">

    Presiona "Iniciar cámara"

  </div>



<script>


// ==========================================================
// CONFIGURACIÓN
// ==========================================================

// URL /exec DE GOOGLE APPS SCRIPT
//
// REEMPLAZA ESTA URL POR TU URL ACTUAL
//

const URL_GOOGLE =
  "https://script.google.com/macros/s/AKfycbxotMqrxSvzT-6wxQfaqSTnKayJcWrSuCSdo0EC_yBzeQ37rs22L4XYhNymtGKslPVh/exec";


// ==========================================================
// VARIABLES
// ==========================================================

let scanner = null;

let procesando = false;

let ultimoQR = "";

let ultimoEscaneo = 0;


// ==========================================================
// ELEMENTOS
// ==========================================================

const boton =
  document.getElementById(
    "btnCamara"
  );


const resultado =
  document.getElementById(
    "resultado"
  );


// ==========================================================
// INICIAR CÁMARA
// ==========================================================

function iniciarScanner() {


  if (
    scanner !== null ||
    procesando
  ) {

    return;

  }


  boton.disabled = true;


  resultado.innerHTML =

    "<div class='info'>" +

    "<h2>📷 Cámara activa</h2>" +

    "<p>" +

    "Apunta la cámara al código QR."

    +

    "</p>" +

    "</div>";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },


    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0

    },


    function(decodedText) {

      procesarQR(decodedText);

    },


    function(errorMessage) {

      // No mostramos errores
      // normales de búsqueda del QR.

    }

  )


  .then(function() {


    resultado.innerHTML =

      "<div class='info'>" +

      "<h2>✓ Cámara activa</h2>" +

      "<p>" +

      "Apunta la cámara al código QR."

      +

      "</p>" +

      "</div>";

  })


  .catch(function(error) {


    scanner = null;

    boton.disabled = false;


    resultado.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ No se pudo abrir la cámara</h2>" +

      "<p>" +

      escaparHTML(error)

      +

      "</p>" +

      "</div>";

  });

}


// ==========================================================
// PROCESAR QR
// ==========================================================

function procesarQR(codigo) {


  // --------------------------------------------------------
  // EVITAR DOBLE LECTURA
  // --------------------------------------------------------

  const ahora =
    Date.now();


  if (
    codigo === ultimoQR &&
    ahora - ultimoEscaneo < 3000
  ) {

    return;

  }


  ultimoQR =
    codigo;


  ultimoEscaneo =
    ahora;


  if (procesando) {

    return;

  }


  procesando = true;


  resultado.innerHTML =

    "<div class='info'>" +

    "<h2>⏳ Procesando...</h2>" +

    "<p>" +

    "Consultando información del alumno..."

    +

    "</p>" +

    "</div>";


  // --------------------------------------------------------
  // DETENER CÁMARA
  // --------------------------------------------------------

  detenerScanner();


  // --------------------------------------------------------
  // ENVIAR QR A GOOGLE APPS SCRIPT
  // --------------------------------------------------------

  const callback =
    "callback_" +
    Date.now();


  window[callback] =
    function(respuesta) {

      try {

        mostrarResultado(
          respuesta
        );

      }

      finally {

        try {

          delete window[callback];

        } catch (e) {}

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_GOOGLE +
    "?idQR=" +
    encodeURIComponent(codigo) +
    "&callback=" +
    callback;


  script.onerror =
    function() {


      try {

        delete window[callback];

      } catch (e) {}


      resultado.innerHTML =

        "<div class='error'>" +

        "<h2>⚠ Error de comunicación</h2>" +

        "<p>" +

        "No fue posible comunicarse con Google Apps Script."

        +

        "</p>" +

        "</div>";


      reiniciarScanner();

    };


  document
    .body
    .appendChild(script);

}


// ==========================================================
// MOSTRAR RESULTADO
// ==========================================================

function mostrarResultado(
  respuesta
) {


  // --------------------------------------------------------
  // ÉXITO
  // --------------------------------------------------------

  if (
    respuesta &&
    respuesta.ok === true
  ) {


    resultado.innerHTML =

      "<div class='exito'>" +

      "<h2>✓ Asistencia registrada</h2>" +

      "<p class='dato'>" +

      "<strong>" +

      escaparHTML(
        respuesta.nombre
      ) +

      "</strong>" +

      "</p>" +

      "<p class='dato'>" +

      "Grupo: " +

      escaparHTML(
        respuesta.grupo
      ) +

      "</p>" +

      "<p class='dato'>" +

      "Fecha: " +

      escaparHTML(
        respuesta.fecha
      ) +

      "</p>" +

      "<p class='dato'>" +

      "Hora: " +

      escaparHTML(
        respuesta.hora
      ) +

      "</p>" +

      "</div>";

  }


  // --------------------------------------------------------
  // DUPLICADO
  // --------------------------------------------------------

  else if (
    respuesta &&
    respuesta.duplicado === true
  ) {


    resultado.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ Ya registrada</h2>" +

      "<p class='dato'>" +

      "<strong>" +

      escaparHTML(
        respuesta.nombre
      ) +

      "</strong>" +

      "</p>" +

      "<p class='dato'>" +

      "Grupo: " +

      escaparHTML(
        respuesta.grupo
      ) +

      "</p>" +

      "<p class='dato'>" +

      "Hora registrada: " +

      escaparHTML(
        respuesta.hora
      ) +

      "</p>" +

      "<p class='dato'>" +

      escaparHTML(
        respuesta.mensaje
      ) +

      "</p>" +

      "</div>";

  }


  // --------------------------------------------------------
  // ERROR
  // --------------------------------------------------------

  else {


    resultado.innerHTML =

      "<div class='error'>" +

      "<h2>⚠ Error</h2>" +

      "<p>" +

      escaparHTML(

        respuesta &&
        respuesta.mensaje

          ?

        respuesta.mensaje

          :

        "Respuesta no válida del servidor."

      )

      +

      "</p>" +

      "</div>";

  }


  reiniciarScanner();

}


// ==========================================================
// DETENER SCANNER
// ==========================================================

function detenerScanner() {


  if (!scanner) {

    return;

  }


  try {

    scanner
      .stop()
      .catch(function() {});

  }

  catch (e) {}

}


// ==========================================================
// REINICIAR
// ==========================================================

function reiniciarScanner() {


  setTimeout(function() {


    procesando = false;

    scanner = null;

    boton.disabled = false;

    iniciarScanner();


  }, 3000);

}


// ==========================================================
// ESCAPAR HTML
// ==========================================================

function escaparHTML(valor) {


  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }


  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>


</body>

</html>
